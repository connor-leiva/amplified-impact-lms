<body>
<x-dc>

<link rel="stylesheet" href="./fonts/geist.css">
<link rel="stylesheet" href="./lms.css">
<script>try{var p=JSON.parse(localStorage.getItem('ai-lms-prefs')||'{}'),d=document.documentElement;d.dataset.theme=p.theme==='dark'?'dark':'light';}catch(e){}</script>
<style>

--page-pad-x:32px;--page-pad-top:32px}
:root[data-theme="dark"]{color-scheme:dark;
--bg-canvas:var(--ink-900);--bg-sidebar:oklch(0.215 0.017 172);--bg-surface:var(--ink-800);--bg-sunken:oklch(0.255 0.018 172);--bg-raised:oklch(0.315 0.019 171);--bg-hover:oklch(0.325 0.019 171);--bg-selected:oklch(0.335 0.019 171);--bg-inverse:var(--ink-50);--bg-overlay:oklch(0 0 0 / 0.55);--bg-poster:oklch(0.195 0.016 172);
--line-subtle:oklch(0.325 0.019 171);--line-default:var(--ink-700);--line-strong:oklch(0.425 0.018 170);
--text-primary:var(--ink-100);--text-secondary:var(--ink-300);--text-tertiary:oklch(0.78 0.016 160);--text-disabled:oklch(0.6 0.016 163);--text-inverse:var(--ink-900);
--action-primary:oklch(0.793 0.116 162);--action-primary-hover:oklch(0.85 0.1 162);--action-on-primary:var(--ink-900);--action-primary-tint:oklch(0.793 0.116 162 / 0.16);--action-primary-line:oklch(0.793 0.116 162 / 0.45);
--text-link:oklch(0.793 0.116 162);--text-link-hover:oklch(0.88 0.08 162);
--action-secondary:oklch(0.315 0.019 171);--action-secondary-hover:oklch(0.355 0.019 171);--action-secondary-line:oklch(0.425 0.018 170);
--seg-track:oklch(0.255 0.018 172);--seg-active:oklch(0.355 0.019 171);--track:oklch(0.365 0.018 170);
--status-success:oklch(0.7 0.14 145);--status-success-text:oklch(0.8 0.12 145);--status-success-bg:oklch(0.7 0.14 145 / 0.14);--status-success-line:oklch(0.7 0.14 145 / 0.38);
--status-progress:oklch(0.68 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.8 calc(var(--progress-c) * 0.7) var(--progress-h));--status-progress-bg:oklch(0.68 var(--progress-c) var(--progress-h) / 0.15);--status-progress-line:oklch(0.68 var(--progress-c) var(--progress-h) / 0.4);
--status-neutral:var(--ink-500);--status-neutral-text:var(--ink-300);--status-neutral-bg:oklch(0.365 0.018 170 / 0.6);--status-neutral-line:var(--ink-700);
--status-attention:oklch(0.68 0.16 32);--status-attention-text:oklch(0.8 0.11 32);--status-attention-bg:oklch(0.68 0.16 32 / 0.14);--status-attention-line:oklch(0.68 0.16 32 / 0.4);
--access-locked:oklch(0.79 0.14 75);--access-locked-text:oklch(0.85 0.12 80);--access-locked-bg:oklch(0.79 0.14 75 / 0.12);--access-locked-line:oklch(0.79 0.14 75 / 0.36);
--shadow-xs:none;--shadow-card:0 8px 24px oklch(0 0 0 / 0.35);--shadow-pop:0 16px 40px oklch(0 0 0 / 0.5);--shadow-drawer:-16px 0 48px oklch(0 0 0 / 0.45)}
@media (max-width:1279px){:root{--page-pad-x:24px}}
@media (max-width:767px){:root{--page-pad-x:16px;--page-pad-top:24px}}
html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}
@keyframes ai-skeleton{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-drawer-in{from{transform:translateX(-100%)}to{transform:none}}
</style>
</helmet>
<sc-if value="{{ loading }}">
  <div aria-hidden="true" style="display:flex; align-items:center; gap:10px; height:32px; padding:{{ pad }}">
    <span style="width:16px; height:16px; flex:none; border-radius:5px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span>
    <sc-if value="{{ showLabel }}"><span style="flex:1; height:10px; border-radius:5px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span></sc-if>
  </div>
</sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <button onClick="{{ click }}" title="{{ tip }}" aria-current="{{ cur }}" aria-disabled="{{ dis }}" style="--hov:{{ hov }}; display:flex; align-items:center; gap:10px; width:100%; height:32px; padding:{{ pad }}; justify-content:{{ jc }}; border:0; border-radius:8px; background:{{ bg }}; color:{{ fg }}; box-shadow:{{ sh }}; cursor:{{ cursor }}; text-align:left; font-size:var(--fs-14); font-weight:{{ fw }}; white-space:nowrap; outline:none; transition:background 120ms" style-hover="background:var(--hov)" style-focus="box-shadow:0 0 0 2px var(--focus-ring)">
    <sc-if value="{{ showIcon }}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px; height:16px; flex:none; fill:none; stroke:{{ ifg }}; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round"><path d="{{ icon }}"></path></svg></sc-if>
    <sc-if value="{{ showLabel }}"><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis">{{ label }}</span></sc-if>
    <sc-if value="{{ showToken }}"><dc-import name="Status Token" kind="{{ token.kind }}" state="{{ token.state }}" n="{{ token.n }}" total="{{ token.total }}" label="{{ token.label }}" tone="{{ token.tone }}" icon="{{ token.icon }}" compact="{{ true }}" hint-size="36px,16px"></dc-import></sc-if>
    <sc-if value="{{ showLock }}"><span title="Team tier" style="display:flex; flex:none; color:var(--text-disabled)"><svg viewBox="0 0 16 16" aria-label="Team tier" style="width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round"><path d="M4.5 7.5h7a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zM5.75 7.5V5.6a2.25 2.25 0 0 1 4.5 0v1.9"></path></svg></span></sc-if>
    <sc-if value="{{ showBadge }}"><span title="{{ badgeTip }}" style="height:var(--bx-20); min-width:var(--bx-20); padding:0 6px; flex:none; border-radius:999px; background:var(--bg-surface); border:1px solid var(--line-default); color:var(--text-secondary); font-size:var(--fs-12); font-weight:500; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums">{{ badge }}</span></sc-if>
    <sc-if value="{{ showChev }}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; flex:none; fill:none; stroke:var(--text-tertiary); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transform:{{ chevRot }}; transition:transform 150ms"><path d="M6 9.5l6 6 6-6"></path></svg></sc-if>
    <sc-if value="{{ spin }}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; flex:none; fill:none; stroke:var(--text-tertiary); stroke-width:2; stroke-linecap:round; animation:ai-spin 900ms linear infinite"><path d="M20.5 12A8.5 8.5 0 1 1 14.91 4.01"></path></svg></sc-if>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;depth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;0|1&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;token&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{kind,state,n,total}&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chev&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;open&quot;,&quot;closed&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;busy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;force&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;active&quot;,&quot;disabled&quot;,&quot;loading&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, f = p.force || '';
    const collapsed = !!p.collapsed, depth = +p.depth || 0, active = !!p.active || f === 'active';
    const locked = !!p.locked, disabled = !!p.disabled || f === 'disabled';
    const hover = f === 'hover', focus = f === 'focus';
    const muted = locked || disabled;
    const bg = active ? 'var(--nav-active, var(--bg-surface))' : hover ? 'var(--nav-hover, var(--bg-hover))' : 'transparent';
    const sh = focus ? '0 0 0 2px var(--focus-ring)' : 'none';
    const showLabel = !collapsed;
    return {
      loading: f === 'loading', ready: f !== 'loading',
      label: p.label || '', icon: p.icon || '', tip: p.title || p.label || '',
      cur: active ? 'page' : undefined, dis: disabled ? 'true' : undefined,
      click: e => { if (disabled) return; p.onClick && p.onClick(e); },
      hov: active ? 'var(--nav-active, var(--bg-surface))' : disabled ? 'transparent' : 'var(--nav-hover, var(--bg-hover))',
      bg, sh, fw: active ? 600 : 500,
      fg: muted ? 'var(--text-disabled)' : active ? 'var(--action-primary)' : 'var(--text-primary)',
      ifg: muted ? 'var(--text-disabled)' : active ? 'var(--action-primary)' : 'var(--text-primary)',
      cursor: disabled ? 'not-allowed' : 'pointer',
      pad: collapsed ? '0' : depth ? '0 10px 0 24px' : '0 10px', jc: collapsed ? 'center' : 'flex-start',
      showIcon: !!p.icon, showLabel,
      token: p.token || {}, showToken: showLabel && !!p.token && !locked && f !== 'loading' && !p.busy,
      showLock: showLabel && locked, showBadge: showLabel && !!p.badge, badge: p.badge, badgeTip: p.badgeTitle || '',
      showChev: showLabel && !!p.chev, chevRot: p.chev === 'closed' ? 'rotate(-90deg)' : 'rotate(0deg)',
      spin: showLabel && !!p.busy,
    };
  }
}
</script>
</body>
</html>
