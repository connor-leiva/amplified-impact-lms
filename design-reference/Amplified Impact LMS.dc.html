--action-primary:oklch(0.793 0.116 162);--action-primary-hover:oklch(0.85 0.1 162);--action-on-primary:var(--ink-900);--action-primary-tint:oklch(0.793 0.116 162 / 0.16);--action-primary-line:oklch(0.793 0.116 162 / 0.45);

@media (max-width:1279px){:root{--page-pad-x:24px}}

html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}

</helmet>
<div style="display:flex; height:100vh; min-height:480px; background:var(--bg-canvas); color:var(--text-primary); font-family:var(--font-ui); font-size:16px; line-height:1.45; overflow:hidden">
  <sc-if value="{{ drawerScrim }}"><div onClick="{{ closeDrawer }}" style="position:fixed; inset:0; z-index:69; background:var(--bg-overlay); animation:ai-fade 160ms ease-out"></div></sc-if>
  <aside aria-label="Primary" style="--nav-hover:color-mix(in oklch, var(--line-default) 70%, var(--bg-sidebar)); --nav-active:var(--action-primary-tint); position:{{ sb.pos }}; top:0; left:0; bottom:0; z-index:{{ sb.z }}; transform:{{ sb.tf }}; transition:transform 220ms cubic-bezier(.2,.8,.2,1), width 180ms ease; flex:none; width:{{ sb.w }}; height:100%; display:flex; flex-direction:column; background:var(--bg-sidebar); border-right:1px solid var(--line-default); box-shadow:{{ sb.sh }}; overflow:hidden">
    <div style="height:64px; flex:none; display:flex; align-items:center; gap:10px; padding:0 {{ sb.headPad }}; border-bottom:1px solid var(--line-default)">
      <div data-brand-slot="" style="flex:none; display:flex"><img src="{{ brand.src }}" alt="" style="display:block; width:{{ brand.w }}px; height:{{ brand.h }}px"></div>
      <sc-if value="{{ drawer }}">
        <button onClick="{{ closeDrawer }}" aria-label="Close menu" style="margin-left:auto; width:44px; height:44px; border:0; border-radius:8px; background:transparent; color:var(--text-tertiary); cursor:pointer; display:flex; align-items:center; justify-content:center" style-hover="background:var(--nav-hover); color:var(--text-primary)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button>
      </sc-if>
    </div>
    <sc-if value="{{ showContext }}">
      <div style="flex:none; padding:14px 20px 0; font-size:16px; line-height:1.4; color:var(--text-tertiary)">{{ contextLine }}</div>
    </sc-if>
    <nav aria-label="Main" style="flex:1; overflow-y:auto; overflow-x:hidden; padding:10px; display:flex; flex-direction:column; gap:14px">
      <sc-for list="{{ nav }}" as="g" hint-placeholder-count="1">
        <div style="display:flex; flex-direction:column; gap:2px">
          <sc-if value="{{ g.showLabel }}"><sc-if value="{{ g.fold }}"><button type="button" onClick="{{ g.toggle }}" aria-expanded="{{ g.openStr }}" aria-controls="{{ g.listId }}" style="display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:44px; padding:4px 10px; border:0; border-radius:8px; background:transparent; font-size:16px; font-weight:600; color:var(--text-tertiary); white-space:nowrap; text-align:left; cursor:pointer; outline:none" style-hover="background:var(--nav-hover)" style-focus="box-shadow:0 0 0 2px var(--focus-ring)"><span style="min-width:0; overflow:hidden; text-overflow:ellipsis">{{ g.label }}</span><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; flex:none; fill:none; stroke:var(--text-tertiary); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transform:{{ g.chevRot }}; transition:transform 150ms"><path d="M6 9.5l6 6 6-6"></path></svg></button></sc-if><sc-if value="{{ g.still }}"><div style="padding:4px 10px; font-size:16px; font-weight:600; color:var(--text-tertiary); white-space:nowrap">{{ g.label }}</div></sc-if></sc-if>
          <div id="{{ g.listId }}" style="display:{{ g.listDisplay }}; flex-direction:column; gap:2px">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
            <dc-import name="Nav Item" label="{{ it.label }}" icon="{{ it.icon }}" active="{{ it.active }}" locked="{{ it.locked }}" depth="{{ it.depth }}" collapsed="{{ collapsed }}" token="{{ it.token }}" badge="{{ it.badge }}" badge-title="{{ it.badgeTitle }}" chev="{{ it.chev }}" title="{{ it.title }}" on-click="{{ it.go }}" hint-size="100%,32px"></dc-import>
          </sc-for>
          </div>
        </div>
      </sc-for>
    </nav>
    <div style="flex:none; border-top:1px solid var(--line-default); padding:10px; display:flex; flex-direction:column; gap:4px">
      <sc-if value="{{ canCollapse }}"><dc-import name="Nav Item" label="{{ sbToggleLabel }}" icon="{{ ic.panel }}" collapsed="{{ collapsed }}" title="{{ sbToggleLabel }}" on-click="{{ toggleSb }}" hint-size="100%,32px"></dc-import></sc-if>
      <button onClick="{{ toggleProfile }}" aria-haspopup="menu" aria-expanded="{{ profileOpenStr }}" title="{{ me.name }} · profile and settings" style="display:flex; align-items:center; gap:10px; width:100%; padding:6px; border:0; border-radius:10px; background:transparent; color:var(--text-primary); cursor:pointer; text-align:left; white-space:nowrap; overflow:hidden; justify-content:{{ profJc }}; outline:none" style-hover="background:var(--nav-hover)" style-focus="box-shadow:0 0 0 2px var(--focus-ring)">
        <span style="width:32px; height:32px; flex:none; border-radius:50%; background:{{ me.av }}; color:var(--ink-900); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600">{{ me.ini }}</span>
        <sc-if value="{{ expanded }}">
          <span style="flex:1; min-width:0; display:flex; flex-direction:column; gap:1px">
            <span style="font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis">{{ me.name }}</span>
            <span style="font-size:16px; color:var(--text-tertiary); overflow:hidden; text-overflow:ellipsis">{{ me.tag }}</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; flex:none; fill:none; stroke:var(--text-tertiary); stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M7.5 9.5 12 5l4.5 4.5M7.5 14.5 12 19l4.5-4.5"></path></svg>
        </sc-if>
      </button>
    </div>
  </aside>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column">
    <header style="height:64px; flex:none; display:flex; align-items:center; gap:12px; padding:0 var(--page-pad-x); border-bottom:1px solid var(--line-default); background:var(--bg-canvas)">
      <sc-if value="{{ drawer }}">
        <button onClick="{{ openDrawer }}" aria-label="Open menu" style="width:44px; height:44px; flex:none; margin-left:-6px; border:0; border-radius:8px; background:transparent; color:var(--text-primary); cursor:pointer; display:flex; align-items:center; justify-content:center" style-hover="background:var(--bg-hover)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
        <div data-brand-slot="" style="flex:none; display:flex"><img src="{{ brandHead.src }}" alt="" style="display:block; width:{{ brandHead.w }}px; height:{{ brandHead.h }}px"></div>
      </sc-if>
      <nav aria-label="Breadcrumb" style="display:flex; align-items:center; gap:8px; min-width:0; flex:1; font-size:16px">
        <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="1">
          <sc-if value="{{ c.sep }}"><span aria-hidden="true" style="color:var(--text-disabled)">/</span></sc-if>
          <button onClick="{{ c.go }}" style="flex:{{ c.flex }}; min-width:0; border:0; background:none; padding:0; color:{{ c.fg }}; font-weight:{{ c.fw }}; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ c.label }}</button>
        </sc-for>
      </nav>
      <sc-if value="{{ demoInline }}" hint-placeholder-val="{{ true }}">
        <div role="group" aria-label="Demo controls" style="display:flex; align-items:center; gap:10px; flex:none">
          <span style="font-size:16px; color:var(--text-tertiary)">View As</span>
          <div style="display:flex; gap:2px; padding:3px; border-radius:9px; background:var(--seg-track); border:1px solid var(--line-default)">
            <sc-for list="{{ roles }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.go }}" aria-pressed="{{ o.on }}" style="height:26px; padding:0 10px; border:0; border-radius:6px; background:{{ o.bg }}; box-shadow:{{ o.sh }}; color:{{ o.fg }}; font-size:16px; font-weight:500; cursor:pointer; white-space:nowrap">{{ o.label }}</button></sc-for>
          </div>
          <span style="font-size:16px; color:var(--text-tertiary); margin-left:4px">Timeline</span>
          <div style="display:flex; gap:2px; padding:3px; border-radius:9px; background:var(--seg-track); border:1px solid var(--line-default)">
            <sc-for list="{{ phases }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.go }}" aria-pressed="{{ o.on }}" style="height:26px; padding:0 10px; border:0; border-radius:6px; background:{{ o.bg }}; box-shadow:{{ o.sh }}; color:{{ o.fg }}; font-size:16px; font-weight:500; cursor:pointer; white-space:nowrap">{{ o.label }}</button></sc-for>
          </div>
          <button onClick="{{ resetDemo }}" style="height:32px; padding:0 10px; border:0; border-radius:8px; background:transparent; color:var(--text-secondary); font-size:16px; font-weight:500; cursor:pointer; white-space:nowrap" style-hover="background:var(--bg-hover); color:var(--text-primary)">Reset Demo</button>
        </div>
      </sc-if>
      <sc-if value="{{ demoCompact }}">
        <button onClick="{{ toggleDemo }}" aria-expanded="{{ demoOpenStr }}" style="height:32px; padding:0 12px; flex:none; border-radius:8px; border:1px solid var(--action-secondary-line); background:var(--action-secondary); color:var(--text-primary); font-size:16px; font-weight:500; cursor:pointer; white-space:nowrap" style-hover="background:var(--action-secondary-hover)">Demo: {{ demoSummary }}</button>
      </sc-if>
    </header>

    <main ref="{{ mainRef }}" style="flex:1; min-height:0; overflow:auto; position:relative">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <div style="padding:32px; color:var(--text-tertiary); font-size:16px">Loading…</div>
      </sc-if>
      <sc-if value="{{ r.dashboard }}"><dc-import name="Portal Dashboard" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.sessions }}"><dc-import name="Portal Sessions" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.workspace }}"><dc-import name="Portal Workspace" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.team }}"><dc-import name="Portal Team Hub" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.vault }}"><dc-import name="Portal Vault" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.upgrade }}"><dc-import name="Portal Upgrade" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.overview }}"><dc-import name="Admin Overview" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.curriculum }}"><dc-import name="Admin Curriculum" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.builder }}"><dc-import name="Admin Module Builder" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.cohorts }}"><dc-import name="Admin Cohorts" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.learners }}"><dc-import name="Admin Learners" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.avault }}"><dc-import name="Admin Vault" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.announce }}"><dc-import name="Admin Announcements" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.tiers }}"><dc-import name="Admin Tiers" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.staff }}"><dc-import name="Admin Staff" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
    </main>
  </div>

  <sc-if value="{{ profileOpen }}">
    <div onClick="{{ closeMenus }}" style="position:fixed; inset:0; z-index:79"></div>
    <div role="menu" aria-label="Profile and settings" style="position:fixed; left:{{ pm.left }}; bottom:{{ pm.bottom }}; z-index:80; width:min(300px, calc(100vw - 24px)); padding:6px; border-radius:12px; background:var(--bg-raised); border:1px solid var(--line-default); box-shadow:var(--shadow-pop); animation:ai-pop 140ms ease-out">
      <div style="display:flex; align-items:center; gap:10px; padding:8px 8px 12px">
        <span style="width:36px; height:36px; flex:none; border-radius:50%; background:{{ me.av }}; color:var(--ink-900); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600">{{ me.ini }}</span>
        <div style="min-width:0"><div style="font-size:16px; font-weight:600">{{ me.name }}</div><div style="font-size:16px; color:var(--text-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ me.email }}</div></div>
      </div>
      <div style="height:1px; background:var(--line-subtle); margin:0 4px"></div>
      <div style="padding:10px 8px; display:flex; flex-direction:column; gap:6px">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:16px">
          <span style="color:var(--text-secondary)">Time Zone: <span style="color:var(--text-primary); font-weight:500">{{ tz.label }}</span></span>
          <button onClick="{{ toggleTz }}" style="border:0; background:none; padding:0; color:var(--text-link); font-size:16px; font-weight:500; cursor:pointer" style-hover="color:var(--text-link-hover)">{{ tz.btn }}</button>
        </div>
        <sc-if value="{{ tzOpen }}">

        return { label, showLabel: !collapsed, items, fold: true, still: false, openStr: String(open), chevRot: open ? 'rotate(0deg)' : 'rotate(-90deg)', listId: `nav-group-${label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`, listDisplay: open ? 'flex' : 'none', toggle: () => this.setState(st => ({ navOpen: { ...st.navOpen, [label]: !open } })) };
      };
      // D-157 (Console PR 1d): the Admin Console's groups (spec § 8), as the app's `consoleNav` renders them for
      // the Owner. Audit Log and Roles & Permissions are Console screens the prototype does not have: here they open the Overview.
      nav = [
        g('Health', [item('overview', 'Overview', ic.chart)]),
        g('Build', [item('curriculum', 'Curriculum', ic.layers, drafts ? { badge: `${drafts} Draft`, badgeTitle: `${drafts} draft AI Employee${drafts === 1 ? '' : 's'}` } : {}), item('builder', 'Module Builder', ic.pencil), item('avault', 'Resource Vault', ic.archive), item('cohorts', 'Cohorts & Sessions', ic.calendar), item('announce', 'Announcements', ic.send)]),
        g('Support', [item('learners', 'Learners & Teams', ic.users)]),
        g('Revenue', [item('tiers', 'Tiers & Upgrades', ic.card, newReq ? { badge: String(newReq), badgeTitle: `${newReq} new upgrade request${newReq === 1 ? '' : 's'}` } : {})]),
        g('Operations', [item('audit', 'Audit Log', ic.listChecks, { go: () => this.nav('overview') })]),
        g('Access', [item('roles', 'Roles & Permissions', ic.lock, { go: () => this.nav('overview') }), item('staff', 'Staff & Roles', ic.shield)]),
      ];
    }

    nav = nav.map((gr, i) => ({ fold: false, still: true, listId: `nav-list-${i}`, listDisplay: 'flex', ...gr }));

    const crumbMap = { dashboard: 'Dashboard', sessions: 'Sessions', team: 'Team Hub', vault: 'Resource Vault', upgrade: 'Team Tier', overview: 'Overview', curriculum: 'Curriculum', cohorts: 'Cohorts & Sessions', learners: 'Learners & Teams', avault: 'Resource Vault', announce: 'Announcements', tiers: 'Tiers & Upgrades', staff: 'Staff & Roles' };
    let crumbList;
    if (route.s === 'workspace') { const m = mods.find(x => x.id === route.id); crumbList = [['AI Employees', () => this.nav('dashboard')], [m ? m.name : '']]; }
    else if (route.s === 'builder') { const m = db.modules.find(x => x.id === route.id); crumbList = [['Curriculum', () => this.nav('curriculum')], [m ? m.name : 'New AI Employee']]; }
    else crumbList = [[crumbMap[route.s] || '']];
    if (isAdmin) crumbList.unshift(['Admin', () => this.nav('overview')]);
    if (vw < 768 && crumbList.length > 1) crumbList = crumbList.slice(-1);
    const crumbs = crumbList.map(([label, go], i) => { const last = i === crumbList.length - 1; return { label, go: go || (() => {}), sep: i > 0, fg: last ? 'var(--text-primary)' : 'var(--text-tertiary)', fw: last ? 600 : 400, flex: last ? '0 1 auto' : '0 0 auto' }; });

    const me = isAdmin
      ? { name: staff.name, email: staff.email, ini: F.initials(staff.name), av: lib.avatarColor(staff.id), tag: 'Owner · Admin Console'}
      : { name: user.name, email: user.email, ini: F.initials(user.name), av: lib.avatarColor(user.id), tag: isTeam ? `${user.role} · Team Tier` : 'Agent Tier' };

    const co = db.cohorts.find(c => c.id === ((user && user.cohortId) || 'dec26')) || db.cohorts[0];
    const contextLine = isAdmin ? `Admin Console · ${co.name} Cohort` : lib.cohortLine(co, now);

    const pz = prefs.tz || '', auto = lib.autoZone();
    const sample = (lib.nextSession(db, user, now) || db.sessions[2]).start;
    const tz = {
      label: pz ? lib.zoneLabel(pz) : `Auto (${lib.zoneLabel(auto) || auto})`, btn: this.state.tzOpen ? 'Done' : 'Change', example: F.time(sample),
      list: lib.ZONES.map(([z, label]) => { const on = pz === z; return { label: z ? `${label} · ${lib.zoneAbbr(z, sample)}` : `Auto · ${lib.zoneLabel(auto) || auto}`, on: on ? 'true' : 'false', bg: on ? 'var(--bg-selected)' : 'transparent', ring: on ? 'var(--action-primary)' : 'var(--line-strong)', dot: on ? 'var(--action-primary)' : 'transparent', go: () => this.setPrefs({ tz: z || null }) }; }),
    };
    const themes = [['light', 'Light', ic.sun], ['dark', 'Dark', ic.moon]].map(([k, l, icon]) => seg((prefs.theme || 'light') === k, () => this.setPrefs({ theme: k }), l, { icon }));
    const pm = drawer ? { left: '12px', bottom: '76px' } : expanded ? { left: '10px', bottom: '64px' } : { left: '72px', bottom: '12px' };

    const lockedMods = this.lockedList();
    const lockedItems = lockedMods.map(m => { const sess = m.session ? lib.sessionFor(db, (user && user.cohortId) || 'dec26', m.session) : null; return { id: m.id, name: m.name, short: m.short, icon: ic[m.icon] || ic.bot, headline: m.headline || m.outcome, outputs: (m.outputs || []).filter(Boolean).slice(0, 3), sessLine: sess ? `Session ${sess.n} · ${F.day(sess.start)}` : 'Self-paced' }; });
    const VAR = { 'Scheduled': 'scheduled', 'Starting Soon': 'starting_soon', 'Live': 'live', 'Ended · Processing': 'ended_processing', 'Replay Ready': 'replay_ready' };
    const ctx = { db, user, staff, team, isTeam, isAdmin, role, route, act, lib, ic, now, phase, vw, compact: vw < 768, forceVariant: VAR[this.props.sessionCard] || null, prefs };

    return {
      ...base, loading: false, r, nav, crumbs, me, ctx, showContext: expanded, contextLine,
      profileOpen: this.state.profileOpen, profileOpenStr: this.state.profileOpen ? 'true' : 'false',
      toggleProfile: () => this.setState(s => ({ profileOpen: !s.profileOpen, demoOpen: false, tzOpen: false })),
      tzOpen: this.state.tzOpen, toggleTz: () => this.setState(s => ({ tzOpen: !s.tzOpen })), tz, themes, pm,
      signOut: () => { this.setState({ profileOpen: false }); this.toast('Signed out (demo)', 'info'); },
      lockedOpen: this.state.locked != null && lockedItems.length > 0, lockedItems, lockedIndex: this.state.locked || 0,
      setLockedIndex: i => this.setState({ locked: i }), closeLocked: () => this.setState({ locked: null }),
      lockedCta: () => { this.setState({ locked: null }); this.nav('upgrade'); },
    };
  }
}
</script>
</body>
</html>
