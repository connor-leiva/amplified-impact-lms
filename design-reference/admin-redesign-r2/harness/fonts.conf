<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The Admin redesign R2 renderer's fallback fonts (D-160, option A, Connor, Nov 16, 2026).

  The self-hosted Geist (design-reference/fonts/, the Google Fonts latin subset) has no U+2192 "→"
  and no U+2318 "⌘", so Chromium draws those two from a system font. This file makes that choice
  fixed for the R2 references and for every app capture compared with them:

    →  FreeSans (put first here; fonts-freefont-ttf, already in the pinned container).
    ⌘  IPAGothic. FreeSans has no U+2318, so the glyph falls through to the next font in the
       container's own order that has it, which is IPAGothic with or without this file.

  It is used ONLY by the R2 renderer, inside mcr.microsoft.com/playwright:v1.63.0-noble:
    refs:   FONTCONFIG_FILE=/work/design-reference/admin-redesign-r2/harness/fonts.conf (pnpm parity:admin-r2:refs)
    parity: compliance/admin-r2.config.ts passes it to the browser's environment (pnpm parity:admin-r2)
  The main compliance config, its 55 goldens and the app never read it.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><edit name="family" mode="prepend" binding="strong"><string>FreeSans</string></edit></match>
</fontconfig>
