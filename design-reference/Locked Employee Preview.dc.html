<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts/geist.css">
<link rel="stylesheet" href="./lms.css">
<script>try{var p=JSON.parse(localStorage.getItem('ai-lms-prefs')||'{}'),d=document.documentElement;d.dataset.theme=p.theme==='dark'?'dark':'light';}catch(e){}</script>
<style>
:root{color-scheme:light;
--font-sans:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;--font-mono:'DM Mono',ui-monospace,monospace;
--ink-50:oklch(0.985 0.004 91);--ink-100:oklch(0.961 0.008 91);--ink-200:oklch(0.922 0.014 89);--ink-300:oklch(0.873 0.0155 90);--ink-400:oklch(0.661 0.017 160);--ink-500:oklch(0.502 0.017 169);--ink-600:oklch(0.397 0.0175 168);--ink-700:oklch(0.365 0.018 170);--ink-800:oklch(0.29 0.019 171);--ink-900:oklch(0.235 0.019 172);
--paper:oklch(1 0 0);--progress-h:258;--progress-c:0.14;
--bg-canvas:var(--ink-100);--bg-sidebar:var(--paper);--bg-surface:var(--paper);--bg-sunken:var(--ink-100);--bg-raised:var(--paper);--bg-hover:var(--ink-100);--bg-selected:var(--ink-100);--bg-inverse:var(--ink-900);--bg-overlay:oklch(0.235 0.019 172 / 0.32);--bg-poster:var(--ink-900);
--line-subtle:color-mix(in oklch,var(--ink-200) 60%,var(--ink-100));--line-default:var(--ink-200);--line-strong:var(--ink-300);
--text-primary:var(--ink-900);--text-secondary:var(--ink-600);--text-tertiary:var(--ink-500);--text-disabled:var(--ink-400);--text-inverse:var(--ink-100);
--action-primary:oklch(0.384 0.056 172);--action-primary-hover:oklch(0.32 0.05 172);--action-on-primary:var(--ink-100);--action-primary-tint:oklch(0.941 0.016 160.6);--action-primary-line:oklch(0.84 0.034 166);
--text-link:oklch(0.384 0.056 172);--text-link-hover:var(--ink-900);
--action-secondary:var(--paper);--action-secondary-hover:var(--ink-100);--action-secondary-line:var(--ink-300);
--seg-track:var(--ink-100);--seg-active:var(--paper);--track:var(--ink-200);--focus-ring:color-mix(in oklch,var(--action-primary) 32%,transparent);
--status-success:oklch(0.6 0.14 145);--status-success-text:oklch(0.47 0.11 145);--status-success-bg:oklch(0.958 0.03 145);--status-success-line:oklch(0.86 0.07 145);--status-success-on:oklch(0.17 0.015 172);
--status-progress:oklch(0.56 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.48 var(--progress-c) var(--progress-h));--status-progress-bg:oklch(0.958 calc(var(--progress-c) * 0.2) var(--progress-h));--status-progress-line:oklch(0.85 calc(var(--progress-c) * 0.45) var(--progress-h));
--status-neutral:var(--ink-400);--status-neutral-text:var(--ink-600);--status-neutral-bg:var(--ink-100);--status-neutral-line:var(--ink-200);
--status-attention:oklch(0.6 0.17 32);--status-attention-text:oklch(0.5 0.15 32);--status-attention-bg:oklch(0.962 0.022 32);--status-attention-line:oklch(0.87 0.06 32);
--access-locked:oklch(0.77 0.14 75);--access-locked-text:oklch(0.5 0.1 65);--access-locked-bg:oklch(0.966 0.032 85);--access-locked-line:oklch(0.87 0.08 80);--access-locked-on:var(--ink-900);
--shadow-xs:0 1px 2px oklch(0.235 0.019 172 / 0.06);--shadow-card:0 1px 2px oklch(0.235 0.019 172 / 0.04),0 8px 24px oklch(0.235 0.019 172 / 0.07);--shadow-pop:0 2px 6px oklch(0.235 0.019 172 / 0.06),0 16px 40px oklch(0.235 0.019 172 / 0.12);--shadow-drawer:-16px 0 48px oklch(0.235 0.019 172 / 0.12);
--page-pad-x:32px;--page-pad-top:32px}
:root[data-theme="dark"]{color-scheme:dark;
--bg-canvas:var(--ink-900);--bg-sidebar:oklch(0.215 0.017 172);--bg-surface:var(--ink-800);--bg-sunken:oklch(0.255 0.018 172);--bg-raised:oklch(0.315 0.019 171);--bg-hover:oklch(0.325 0.019 171);--bg-selected:oklch(0.335 0.019 171);--bg-inverse:var(--ink-50);--bg-overlay:oklch(0 0 0 / 0.55);--bg-poster:oklch(0.195 0.016 172);
--line-subtle:oklch(0.325 0.019 171);--line-default:var(--ink-700);--line-strong:oklch(0.425 0.018 170);
--text-primary:var(--ink-100);--text-secondary:var(--ink-300);--text-tertiary:oklch(0.78 0.016 160);--text-disabled:oklch(0.6 0.016 163);--text-inverse:var(--ink-900);
--action-primary:oklch(0.793 0.116 162);--action-primary-hover:oklch(0.85 0.1 162);--action-on-primary:var(--ink-900);--action-primary-tint:oklch(0.793 0.116 162 / 0.16);--action-primary-line:oklch(0.793 0.116 162 / 0.45);
--text-link:oklch(0.793 0.116 162);--text-link-hover:oklch(0.88 0.08 162);
--action-secondary:oklch(0.315 0.019 171);--action-secondary-hover:oklch(0.355 0.019 171);--action-secondary-line:oklch(0.425 0.018 170);
--seg-track:oklch(0.255 0.018 172);--seg-active:oklch(0.355 0.019 171);--track:oklch(0.365 0.018 170);
--status-success:oklch(0.7 0.14 145);--status-success-text:oklch(0.8 0.12 145);--status-success-bg:oklch(0.7 0.14 145 / 0.14);--status-success-line:oklch(0.7 0.14 145 / 0.38);
--status-progress:oklch(0.68 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.8 calc(var(--progress-c) * 0.7) var(--progress-h));--status-progress-bg:oklch(0.68 var(--progress-c) var(--progress-h) / 0.15);--status-progress-line:oklch(0.68 var(--progress-c) var(--progress-h) / 0.4);
--status-neutral:var(--ink-500);--status-neutral-text:var(--ink-300);--status-neutral-bg:oklch(0.365 0.018 170 / 0.6);--status-neutral-line:var(--ink-700);
--status-attention:oklch(0.68 0.16 32);--status-attention-text:oklch(0.8 0.11 32);--status-attention-bg:oklch(0.68 0.16 32 / 0.14);--status-attention-line:oklch(0.68 0.16 32 / 0.4);
--access-locked:oklch(0.79 0.14 75);--access-locked-text:oklch(0.85 0.12 80);--access-locked-bg:oklch(0.79 0.14 75 / 0.12);--access-locked-line:oklch(0.79 0.14 75 / 0.36);
--shadow-xs:none;--shadow-card:0 8px 24px oklch(0 0 0 / 0.35);--shadow-pop:0 16px 40px oklch(0 0 0 / 0.5);--shadow-drawer:-16px 0 48px oklch(0 0 0 / 0.45)}
@media (max-width:1279px){:root{--page-pad-x:24px}}
@media (max-width:767px){:root{--page-pad-x:16px;--page-pad-top:24px}}
html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}
@keyframes ai-skeleton{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-drawer-in{from{transform:translateX(-100%)}to{transform:none}}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="{{ it.name }}" style="width:min(520px, 100%); border-radius:16px; background:var(--bg-raised); border:1px solid var(--line-default); box-shadow:var(--shadow-pop); overflow:hidden; animation:ai-pop 200ms ease-out">
  <div style="display:flex; align-items:center; gap:10px; padding:12px 12px 12px 16px; border-bottom:1px solid var(--line-subtle)">
    <div role="tablist" style="flex:1; min-width:0; display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--seg-track); overflow-x:auto">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="flex:1; height:28px; padding:0 10px; border:0; border-radius:7px; background:{{ t.bg }}; box-shadow:{{ t.sh }}; color:{{ t.fg }}; font-size:16px; font-weight:500; cursor:pointer; white-space:nowrap">{{ t.label }}</button>
      </sc-for>
    </div>
    <button onClick="{{ close }}" aria-label="Close" style="width:32px; height:32px; flex:none; border:0; border-radius:8px; background:transparent; color:var(--text-tertiary); cursor:pointer; display:flex; align-items:center; justify-content:center; outline:none" style-hover="background:var(--bg-hover); color:var(--text-primary)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button>
  </div>
  <div style="padding:24px; display:flex; flex-direction:column; gap:16px">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px">
      <div style="width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--access-locked-bg); border:1px solid var(--access-locked-line)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px; height:20px; fill:none; stroke:var(--access-locked-text); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round"><path d="{{ it.icon }}"></path></svg></div>
      <dc-import name="Status Token" kind="access" state="locked" label="Included in Team tier" hint-size="150px,22px"></dc-import>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px">
      <div style="font-size:20px; font-weight:600; letter-spacing:-0.015em; line-height:1.3; text-wrap:pretty">{{ it.headline }}</div>
      <div style="font-size:16px; color:var(--text-tertiary)">{{ it.name }} · {{ it.sessLine }}</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:9px">
      <sc-for list="{{ it.outputs }}" as="o" hint-placeholder-count="3">
        <div style="display:flex; gap:10px; font-size:16px; color:var(--text-secondary); line-height:1.45"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px; height:16px; flex:none; margin-top:2px; fill:none; stroke:var(--status-success); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round"><path d="M5 12.6l4.4 4.4L19 7.4"></path></svg>{{ o }}</div>
      </sc-for>
    </div>
  </div>
  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 24px 20px">
    <span style="font-size:16px; color:var(--text-tertiary)">{{ note }}</span>
    <button onClick="{{ cta }}" style="height:38px; padding:0 16px; border-radius:8px; border:1px solid transparent; background:var(--action-primary); color:var(--action-on-primary); font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; outline:none" style-hover="background:var(--action-primary-hover)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)">See Team Tier<svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M4.5 12h14.5M13.5 6.5 19 12l-5.5 5.5"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:460},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id,name,short,icon,headline,outputs,sessLine}[]&quot;},&quot;index&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onIndex&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i) =&gt; void&quot;},&quot;onCta&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(item) =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, items = p.items || [], i = Math.min(Math.max(0, +p.index || 0), Math.max(0, items.length - 1));
    const it = items[i] || { name: '', headline: '', outputs: [], icon: '', sessLine: '' };
    return {
      it, note: 'Your Agent tier progress carries over.',
      tabs: items.map((x, k) => ({ label: x.short || x.name, sel: k === i ? 'true' : 'false', bg: k === i ? 'var(--seg-active)' : 'transparent', sh: k === i ? 'var(--shadow-xs)' : 'none', fg: k === i ? 'var(--text-primary)' : 'var(--text-secondary)', go: () => p.onIndex && p.onIndex(k) })),
      close: () => p.onClose && p.onClose(), cta: () => p.onCta && p.onCta(it),
    };
  }
}
</script>
</body>
</html>
