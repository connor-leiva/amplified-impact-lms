<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<script>try{var p=JSON.parse(localStorage.getItem('ai-lms-prefs')||'{}'),d=document.documentElement;d.dataset.theme=p.theme==='dark'?'dark':'light';if(p.accent&&p.accent!=='pine')d.dataset.accent=p.accent;if(p.font&&p.font!=='hanken')d.dataset.font=p.font;}catch(e){}</script>
<style>
:root{color-scheme:light;
--font-sans:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;--font-mono:'DM Mono',ui-monospace,monospace;
--ink-50:oklch(0.985 0.003 85);--ink-100:oklch(0.962 0.004 85);--ink-200:oklch(0.925 0.005 85);--ink-300:oklch(0.865 0.006 85);--ink-400:oklch(0.72 0.007 85);--ink-500:oklch(0.53 0.008 85);--ink-600:oklch(0.42 0.008 85);--ink-700:oklch(0.30 0.008 85);--ink-800:oklch(0.225 0.007 85);--ink-900:oklch(0.17 0.006 85);
--paper:oklch(1 0 0);--accent-h:192;--accent-c:0.08;--progress-h:258;--progress-c:0.14;
--bg-canvas:var(--ink-50);--bg-sidebar:var(--ink-100);--bg-surface:var(--paper);--bg-sunken:var(--ink-50);--bg-raised:var(--paper);--bg-hover:var(--ink-100);--bg-selected:var(--ink-100);--bg-inverse:var(--ink-900);--bg-overlay:oklch(0.17 0.006 85 / 0.32);--bg-poster:var(--ink-900);
--line-subtle:color-mix(in oklch,var(--ink-200) 60%,var(--ink-100));--line-default:var(--ink-200);--line-strong:var(--ink-300);
--text-primary:var(--ink-900);--text-secondary:var(--ink-600);--text-tertiary:var(--ink-500);--text-disabled:var(--ink-400);--text-inverse:var(--paper);
--action-primary:oklch(0.46 var(--accent-c) var(--accent-h));--action-primary-hover:oklch(0.40 var(--accent-c) var(--accent-h));--action-on-primary:var(--paper);--action-primary-tint:oklch(0.955 calc(var(--accent-c) * 0.3) var(--accent-h));--action-primary-line:oklch(0.84 calc(var(--accent-c) * 0.6) var(--accent-h));
--text-link:oklch(0.44 var(--accent-c) var(--accent-h));--text-link-hover:oklch(0.36 var(--accent-c) var(--accent-h));
--action-secondary:var(--paper);--action-secondary-hover:var(--ink-100);--action-secondary-line:var(--ink-300);
--seg-track:var(--ink-100);--seg-active:var(--paper);--track:var(--ink-200);--focus-ring:color-mix(in oklch,var(--action-primary) 32%,transparent);
--status-success:oklch(0.6 0.14 145);--status-success-text:oklch(0.47 0.11 145);--status-success-bg:oklch(0.958 0.03 145);--status-success-line:oklch(0.86 0.07 145);--status-success-on:var(--ink-900);
--status-progress:oklch(0.56 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.48 var(--progress-c) var(--progress-h));--status-progress-bg:oklch(0.958 calc(var(--progress-c) * 0.2) var(--progress-h));--status-progress-line:oklch(0.85 calc(var(--progress-c) * 0.45) var(--progress-h));
--status-neutral:var(--ink-400);--status-neutral-text:var(--ink-600);--status-neutral-bg:var(--ink-100);--status-neutral-line:var(--ink-200);
--status-attention:oklch(0.6 0.17 32);--status-attention-text:oklch(0.5 0.15 32);--status-attention-bg:oklch(0.962 0.022 32);--status-attention-line:oklch(0.87 0.06 32);
--access-locked:oklch(0.77 0.14 75);--access-locked-text:oklch(0.5 0.1 65);--access-locked-bg:oklch(0.966 0.032 85);--access-locked-line:oklch(0.87 0.08 80);--access-locked-on:var(--ink-900);
--shadow-xs:0 1px 2px oklch(0.17 0.006 85 / 0.06);--shadow-card:0 1px 2px oklch(0.17 0.006 85 / 0.04),0 8px 24px oklch(0.17 0.006 85 / 0.07);--shadow-pop:0 2px 6px oklch(0.17 0.006 85 / 0.06),0 16px 40px oklch(0.17 0.006 85 / 0.12);--shadow-drawer:-16px 0 48px oklch(0.17 0.006 85 / 0.12);
--page-pad-x:32px;--page-pad-top:32px}
:root[data-accent="indigo"]{--accent-h:275;--accent-c:0.15;--progress-h:212;--progress-c:0.09}
:root[data-accent="plum"]{--accent-h:340;--accent-c:0.12}
:root[data-font="instrument"]{--font-sans:'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
:root[data-font="schibsted"]{--font-sans:'Schibsted Grotesk',ui-sans-serif,system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;
--bg-canvas:var(--ink-900);--bg-sidebar:oklch(0.15 0.006 85);--bg-surface:var(--ink-800);--bg-sunken:oklch(0.19 0.006 85);--bg-raised:oklch(0.25 0.007 85);--bg-hover:oklch(0.26 0.007 85);--bg-selected:oklch(0.27 0.007 85);--bg-inverse:var(--ink-50);--bg-overlay:oklch(0 0 0 / 0.55);--bg-poster:oklch(0.13 0.005 85);
--line-subtle:oklch(0.26 0.007 85);--line-default:var(--ink-700);--line-strong:oklch(0.36 0.008 85);
--text-primary:var(--ink-50);--text-secondary:var(--ink-300);--text-tertiary:var(--ink-400);--text-disabled:var(--ink-500);--text-inverse:var(--ink-900);
--action-primary:oklch(0.56 var(--accent-c) var(--accent-h));--action-primary-hover:oklch(0.62 var(--accent-c) var(--accent-h));--action-primary-tint:oklch(0.6 var(--accent-c) var(--accent-h) / 0.16);--action-primary-line:oklch(0.6 var(--accent-c) var(--accent-h) / 0.45);
--text-link:oklch(0.78 var(--accent-c) var(--accent-h));--text-link-hover:oklch(0.86 var(--accent-c) var(--accent-h));
--action-secondary:oklch(0.25 0.007 85);--action-secondary-hover:oklch(0.29 0.007 85);--action-secondary-line:oklch(0.36 0.008 85);
--seg-track:oklch(0.19 0.006 85);--seg-active:oklch(0.29 0.007 85);--track:oklch(0.3 0.008 85);
--status-success:oklch(0.7 0.14 145);--status-success-text:oklch(0.8 0.12 145);--status-success-bg:oklch(0.7 0.14 145 / 0.14);--status-success-line:oklch(0.7 0.14 145 / 0.38);
--status-progress:oklch(0.68 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.8 calc(var(--progress-c) * 0.7) var(--progress-h));--status-progress-bg:oklch(0.68 var(--progress-c) var(--progress-h) / 0.15);--status-progress-line:oklch(0.68 var(--progress-c) var(--progress-h) / 0.4);
--status-neutral:var(--ink-500);--status-neutral-text:var(--ink-300);--status-neutral-bg:oklch(0.3 0.008 85 / 0.6);--status-neutral-line:var(--ink-700);
--status-attention:oklch(0.68 0.16 32);--status-attention-text:oklch(0.8 0.11 32);--status-attention-bg:oklch(0.68 0.16 32 / 0.14);--status-attention-line:oklch(0.68 0.16 32 / 0.4);
--access-locked:oklch(0.79 0.14 75);--access-locked-text:oklch(0.85 0.12 80);--access-locked-bg:oklch(0.79 0.14 75 / 0.12);--access-locked-line:oklch(0.79 0.14 75 / 0.36);
--shadow-xs:none;--shadow-card:0 8px 24px oklch(0 0 0 / 0.35);--shadow-pop:0 16px 40px oklch(0 0 0 / 0.5);--shadow-drawer:-16px 0 48px oklch(0 0 0 / 0.45)}
@media (max-width:1279px){:root{--page-pad-x:24px}}
@media (max-width:767px){:root{--page-pad-x:16px;--page-pad-top:24px}}
html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}
@keyframes ai-skeleton{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-drawer-in{from{transform:translateX(-100%)}to{transform:none}}
</style>
</helmet>
<sc-if value="{{ loading }}">
  <div aria-hidden="true" style="display:flex; flex-direction:column; gap:14px; height:100%; min-height:236px; padding:18px; border-radius:14px; background:var(--bg-surface); border:1px solid var(--line-default)">
    <div style="display:flex; justify-content:space-between"><span style="width:38px; height:38px; border-radius:10px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span><span style="width:70px; height:22px; border-radius:999px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span></div>
    <span style="width:70%; height:14px; border-radius:6px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span>
    <span style="width:95%; height:10px; border-radius:6px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span>
    <span style="width:80%; height:10px; border-radius:6px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span>
    <span style="margin-top:auto; width:120px; height:34px; border-radius:8px; background:var(--bg-hover); animation:ai-skeleton 1.4s ease-in-out infinite"></span>
  </div>
</sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div role="button" tabIndex="{{ tab }}" aria-label="{{ aria }}" aria-disabled="{{ ariaDis }}" onClick="{{ open }}" onKeyDown="{{ key }}" style="--hov-bd:{{ hovBd }}; --hov-sh:{{ hovSh }}; --hov-tf:{{ hovTf }}; display:flex; flex-direction:column; gap:14px; height:100%; padding:18px; border-radius:14px; background:var(--bg-surface); border:1px solid {{ bd }}; box-shadow:{{ sh }}; transform:{{ tf }}; cursor:{{ cursor }}; opacity:{{ op }}; outline:none; transition:border-color 150ms, box-shadow 150ms, transform 150ms" style-hover="border-color:var(--hov-bd); box-shadow:var(--hov-sh); transform:var(--hov-tf)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
      <div style="width:38px; height:38px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; background:{{ tileBg }}; border:1px solid {{ tileBd }}">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px; height:18px; fill:none; stroke:{{ tileFg }}; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round"><path d="{{ c.icon }}"></path></svg>
      </div>
      <dc-import name="Status Token" kind="{{ tk.kind }}" state="{{ tk.state }}" n="{{ c.n }}" total="{{ c.total }}" label="{{ tk.label }}" tone="{{ tk.tone }}" icon="{{ tk.icon }}" hint-size="80px,22px"></dc-import>
    </div>
    <div style="display:flex; flex-direction:column; gap:4px">
      <div style="font-size:16px; font-weight:600; letter-spacing:-0.01em; color:{{ nameFg }}">{{ c.name }}</div>
      <div style="font-size:13px; line-height:1.45; color:var(--text-secondary); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-wrap:pretty">{{ c.outcome }}</div>
    </div>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:12px">
      <sc-if value="{{ showSegs }}">
        <div title="{{ segTip }}" style="display:flex; gap:3px">
          <sc-for list="{{ segs }}" as="sg"><span style="flex:1; height:4px; border-radius:2px; background:{{ sg }}"></span></sc-for>
        </div>
      </sc-if>
      <div style="display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12px; color:var(--text-tertiary)"><span>{{ c.sessLine }}</span><span>{{ c.mins }} Min Build</span></div>
      <div style="padding-top:12px; border-top:1px solid var(--line-subtle)">
        <button onClick="{{ open }}" tabIndex="-1" style="--b-hov:{{ ctaHov }}; height:32px; padding:0 12px; border-radius:8px; border:1px solid {{ ctaBd }}; background:{{ ctaBg }}; color:{{ ctaFg }}; font-size:13px; font-weight:600; cursor:{{ cursor }}; display:inline-flex; align-items:center; gap:7px; white-space:nowrap" style-hover="background:var(--b-hov)">{{ c.cta }}<svg viewBox="0 0 24 24" aria-hidden="true" style="width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="M4.5 12h14.5M13.5 6.5 19 12l-5.5 5.5"></path></svg></button>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:260},&quot;card&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;CardVM (lib.cardVM)&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(card) =&gt; void&quot;},&quot;force&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;hover&quot;,&quot;focus&quot;,&quot;disabled&quot;,&quot;loading&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, f = p.force || '', c = p.card || { segs: [], n: 0, total: 6 };
    const disabled = f === 'disabled', hover = f === 'hover', focus = f === 'focus';
    const tk = c.locked ? { kind: 'access', state: 'locked' } : c.soon ? { kind: 'custom', tone: 'neutral', icon: 'clock', label: c.opensLabel} : { kind: 'build', state: c.state };
    const tile = c.locked ? ['var(--access-locked-bg)', 'var(--access-locked-line)', 'var(--access-locked-text)']
      : c.state === 'verified' ? ['var(--status-success-bg)', 'var(--status-success-line)', 'var(--status-success-text)']
      : ['var(--action-primary-tint)', 'var(--action-primary-line)', 'var(--action-primary)'];
    const segC = c.state === 'verified' ? 'var(--status-success)' : 'var(--status-progress)';
    const open = e => { if (e && e.stopPropagation) e.stopPropagation(); if (disabled) return; p.onOpen && p.onOpen(c); };
    const primary = !!c.primary && !disabled;
    return {
      loading: f === 'loading', ready: f !== 'loading', c, tk,
      tileBg: tile[0], tileBd: tile[1], tileFg: tile[2], nameFg: c.locked || disabled ? 'var(--text-secondary)' : 'var(--text-primary)',
      showSegs: !c.locked && !c.soon, segs: (c.segs || []).map(on => (on ? segC : 'var(--track)')), segTip: `${c.n} of ${c.total} steps verified`,
      bd: hover ? 'var(--line-strong)' : 'var(--line-default)', sh: focus ? '0 0 0 3px var(--focus-ring)' : hover ? 'var(--shadow-card)' : 'none',
      tf: hover ? 'translateY(-1px)' : 'none', op: disabled ? 0.55 : 1, cursor: disabled ? 'not-allowed' : 'pointer',
      hovBd: disabled ? 'var(--line-default)' : 'var(--line-strong)', hovSh: disabled ? 'none' : 'var(--shadow-card)', hovTf: disabled ? 'none' : 'translateY(-1px)',
      tab: disabled ? '-1' : '0', ariaDis: disabled ? 'true' : undefined, aria: `${c.name}. ${c.locked ? 'Team tier.' : ''} ${c.cta}`,
      key: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }, open,
      ctaBg: primary ? 'var(--action-primary)' : 'var(--action-secondary)', ctaFg: primary ? 'var(--action-on-primary)' : disabled ? 'var(--text-disabled)' : 'var(--text-primary)',
      ctaBd: primary ? 'transparent' : 'var(--action-secondary-line)', ctaHov: primary ? 'var(--action-primary-hover)' : disabled ? 'var(--action-secondary)' : 'var(--action-secondary-hover)',
    };
  }
}
</script>
</body>
</html>
