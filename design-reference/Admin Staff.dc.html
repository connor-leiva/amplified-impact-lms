<style>

:root[data-theme="dark"]{color-scheme:dark;

--text-primary:var(--ink-100);--text-secondary:var(--ink-300);--text-tertiary:oklch(0.78 0.016 160);--text-disabled:oklch(0.6 0.016 163);--text-inverse:var(--ink-900);
--action-primary:oklch(0.793 0.116 162);--action-primary-hover:oklch(0.85 0.1 162);--action-on-primary:var(--ink-900);--action-primary-tint:oklch(0.793 0.116 162 / 0.16);--action-primary-line:oklch(0.793 0.116 162 / 0.45);
--text-link:oklch(0.793 0.116 162);--text-link-hover:oklch(0.88 0.08 162);
--action-secondary:oklch(0.315 0.019 171);--action-secondary-hover:oklch(0.355 0.019 171);--action-secondary-line:oklch(0.425 0.018 170);
--seg-track:oklch(0.255 0.018 172);--seg-active:oklch(0.355 0.019 171);--track:oklch(0.365 0.018 170);
--status-success:oklch(0.7 0.14 145);--status-success-text:oklch(0.8 0.12 145);--status-success-bg:oklch(0.7 0.14 145 / 0.14);--status-success-line:oklch(0.7 0.14 145 / 0.38);
--status-progress:oklch(0.68 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.8 calc(var(--progress-c) * 0.7) var(--progress-h));--status-progress-bg:oklch(0.68 var(--progress-c) var(--progress-h) / 0.15);--status-progress-line:oklch(0.68 var(--progress-c) var(--progress-h) / 0.4);
--status-neutral:var(--ink-500);--status-neutral-text:var(--ink-300);--status-neutral-bg:oklch(0.365 0.018 170 / 0.6);--status-neutral-line:var(--ink-700);
--status-attention:oklch(0.68 0.16 32);--status-attention-text:oklch(0.8 0.11 32);--status-attention-bg:oklch(0.68 0.16 32 / 0.14);--status-attention-line:oklch(0.68 0.16 32 / 0.4);

--shadow-xs:none;--shadow-card:0 8px 24px oklch(0 0 0 / 0.35);--shadow-pop:0 16px 40px oklch(0 0 0 / 0.5);--shadow-drawer:-16px 0 48px oklch(0 0 0 / 0.45)}
@media (max-width:1279px){:root{--page-pad-x:24px}}
@media (max-width:767px){:root{--page-pad-x:16px;--page-pad-top:24px}}
html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:where(:hover){color:var(--text-link-hover)}a:not([class]):hover{text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}
@keyframes ai-skeleton{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-drawer-in{from{transform:translateX(-100%)}to{transform:none}}
</style>
</helmet>
<div style="padding:var(--page-pad-top) var(--page-pad-x) 56px; max-width:1300px; margin:0 auto; display:flex; flex-direction:column; gap:18px">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap">
    <div>
      <h1 style="margin:0; font-size:26px; line-height:32px; font-weight:600; letter-spacing:-0.02em">Staff &amp; Roles</h1>
      <p style="margin:4px 0 0; color:var(--text-secondary); font-size:var(--fs-14)">Who can build, publish and manage the program.</p>
    </div>
  </div>

  <section style="border-radius:12px; border:1px solid var(--line-default); background:var(--bg-surface); overflow:hidden">
    <div style="display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line-default); flex-wrap:wrap">
      <div style="font-size:var(--fs-14); font-weight:600; flex:1">Team Members</div>
      <input data-phone="cell" value="{{ email }}" onChange="{{ setEmail }}" placeholder="name@amplifiedimpact.com" style="width:240px; height:34px; padding:0 11px; border-radius:8px; border:1px solid var(--line-default); background:var(--bg-sunken); color:var(--text-primary); font-size:var(--fs-13); outline:none" style-focus="border-color:var(--action-primary)">
      <select value="{{ newRole }}" onChange="{{ setNewRole }}" style="height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--line-default); background:var(--bg-sunken); color:var(--text-primary); font-size:var(--fs-13); outline:none">
        <option value="Admin">Admin</option>
        <option value="Instructor">Instructor</option>
        <option value="Content Editor">Content Editor</option>
        <option value="Support">Support</option>
      </select>
      <button onClick="{{ invite }}" style="height:34px; min-height:var(--tap-primary); padding:0 14px; border-radius:8px; border:1px solid var(--action-primary); background:var(--action-primary); color:var(--action-on-primary); font-size:var(--fs-13); font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap"><svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.userPlus }}"></path></svg>Invite Staff</button>
    </div>
    <sc-if value="{{ err }}"><div style="padding:8px 18px 0; font-size:var(--fs-13); color:var(--access-locked-text)">{{ err }}</div></sc-if>
    <sc-for list="{{ staff }}" as="s" hint-placeholder-count="4">
      <div style="display:flex; align-items:center; gap:12px; padding:12px 18px; border-top:{{ s.bt }}; flex-wrap:wrap">
        <span style="width:32px; height:32px; flex:none; border-radius:50%; background:{{ s.av }}; border:{{ s.avBd }}; display:flex; align-items:center; justify-content:center; font-size:var(--fs-12); font-weight:600; color:var(--ink-900)">{{ s.ini }}</span>
        <div style="flex:1; min-width:200px"><div style="font-size:var(--fs-14); font-weight:500">{{ s.name }}</div><div style="font-size:var(--fs-12); color:var(--text-tertiary)">{{ s.email }}</div></div>
        <span data-phone="cell" style="font-size:var(--fs-13); color:var(--text-tertiary); width:120px">{{ s.last }}</span>
        <select value="{{ s.role }}" onChange="{{ s.setRole }}" disabled="{{ s.isOwner }}" style="height:32px; width:150px; padding:0 8px; border-radius:7px; border:1px solid var(--line-default); background:var(--bg-sunken); color:var(--text-primary); font-size:var(--fs-13); outline:none">
          <option value="Owner">Owner</option>
          <option value="Admin">Admin</option>
          <option value="Instructor">Instructor</option>
          <option value="Content Editor">Content Editor</option>
          <option value="Support">Support</option>
        </select>
        <button onClick="{{ s.remove }}" title="Remove" style="width:30px; height:30px; border:0; border-radius:7px; background:transparent; color:{{ s.rmFg }}; cursor:pointer; display:flex; align-items:center; justify-content:center" style-hover="background:var(--status-attention-bg)"><svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.trash }}"></path></svg></button>
      </div>
    </sc-for>
  </section>

  <section style="border-radius:12px; border:1px solid var(--line-default); background:var(--bg-surface); overflow:hidden">
    <div style="padding:14px 18px; border-bottom:1px solid var(--line-default)"><div style="font-size:var(--fs-14); font-weight:600">Permissions</div><div style="font-size:var(--fs-12); color:var(--text-tertiary); margin-top:2px">Owner Permissions Are Fixed</div></div>
    <div data-phone="tscroll" style="overflow-x:auto">
      <div data-phone="tmin" style="min-width:760px">
        <div data-phone="thead" style="display:grid; grid-template-columns:minmax(220px,1.6fr) repeat(5, 1fr); padding:10px 18px; font-size:var(--fs-13); font-weight:500; color:var(--text-tertiary); border-bottom:1px solid var(--line-default)">
          <span>Permission</span><sc-for list="{{ roles }}" as="r"><span style="text-align:center">{{ r }}</span></sc-for>
        </div>
        <sc-for list="{{ perms }}" as="p" hint-placeholder-count="8">
          <div data-phone="card-grid" style="display:grid; grid-template-columns:minmax(220px,1.6fr) repeat(5, 1fr); align-items:center; padding:9px 18px; border-bottom:1px solid var(--line-default)">
            <span data-phone="cell" style="font-size:var(--fs-13); color:var(--text-secondary)">{{ p.label }}</span>
            <sc-for list="{{ p.cells }}" as="cl">
              <div data-phone="cell-inline" data-label="{{ roles[$index] }}" style="display:flex; justify-content:center">
                <button onClick="{{ cl.go }}" style="width:22px; height:22px; border-radius:6px; border:1.5px solid {{ cl.bd }}; background:{{ cl.bg }}; cursor:{{ cl.cursor }}; display:flex; align-items:center; justify-content:center; padding:0; opacity:{{ cl.op }}">
                  <sc-if value="{{ cl.on }}"><svg viewBox="0 0 24 24" style="width:13px; height:13px; fill:none; stroke:var(--action-on-primary); stroke-width:3; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.check }}"></path></svg></sc-if>
                </button>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  get cx() { return this.props.ctx || (this.state && this.state.sctx) || null; }
  bootStandalone() { if (this.props.ctx || this._sa) return; this._sa = 1; import(new URL('./lms-data.js', document.baseURI).href).then(lib => lib.standalone(this, lib, "admin", {"s":"staff"})); }
  componentDidMount() { this.bootStandalone(); }
  state = { email: '', newRole: 'Instructor', err: '' };
  renderVals() {
    const c = this.cx; if (!c || !c.db) return {};
    const { db, lib, ic, act } = c;
    const F = lib.fmt, now = act.now();
    const staff = db.staff.map((s, i) => {
      const inv = !s.last, owner = s.role === 'Owner';
      return {
        name: s.name + (i === 0 ? ' (you)' : ''), email: s.email, role: s.role, isOwner: owner, ini: F.initials(s.name), av: inv ? 'transparent' : lib.avatarColor(s.id), avBd: inv ? '1.5px dashed var(--access-locked)' : '0',
        last: inv ? 'Invite pending' : 'Active ' + F.agoInline(s.last, now), bt: i ? '1px solid var(--line-subtle)' : '0', rmFg: owner ? 'var(--text-disabled)' : 'var(--text-tertiary)',
        setRole: e => { const v = e.target.value; act.mutate(d => { d.staff.find(x => x.id === s.id).role = v; }, `${s.name} is now ${v}`); },
        remove: () => owner ? act.toast('The owner can’t be removed', 'info') : act.mutate(d => { d.staff = d.staff.filter(x => x.id !== s.id); }, `${s.name} removed`),
      };
    });
    const roles = lib.STAFF_ROLES;
    const perms = lib.PERMS.map(([k, label]) => ({ label, cells: roles.map(r => {
      const on = !!(db.perms[r] || {})[k], fixed = r === 'Owner';
      return { on, bd: on ? 'var(--action-primary)' : 'var(--line-strong)', bg: on ? 'var(--action-primary)' : 'transparent', cursor: fixed ? 'default' : 'pointer', op: fixed ? 0.6 : 1,
        go: () => !fixed && act.mutate(d => { d.perms[r] = d.perms[r] || {}; d.perms[r][k] = on ? 0 : 1; }, `${r}: ${label} ${on ? 'off' : 'on'}`, 'info') };
    }) }));
    const { email, newRole, err } = this.state;
    return {
      ic, staff, roles, perms, email, newRole, err,
      setEmail: e => this.setState({ email: e.target.value, err: '' }), setNewRole: e => this.setState({ newRole: e.target.value }),
      invite: () => {
        const em = email.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return this.setState({ err: 'Enter a valid email address.' });
        if (db.staff.some(s => s.email.toLowerCase() === em.toLowerCase())) return this.setState({ err: 'That person is already on staff.' });
        const nm = em.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
        act.mutate(d => { d.staff.push({ id: 'st' + act.now().toString(36), name: nm, email: em, role: newRole, last: null }); }, `Invite sent to ${em}`);
        this.setState({ email: '' });
      },
    };
  }
}
</script>
</body>
</html>
