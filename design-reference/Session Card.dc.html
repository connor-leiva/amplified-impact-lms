<style>

--status-progress:oklch(0.68 var(--progress-c) var(--progress-h));--status-progress-text:oklch(0.8 calc(var(--progress-c) * 0.7) var(--progress-h));--status-progress-bg:oklch(0.68 var(--progress-c) var(--progress-h) / 0.15);--status-progress-line:oklch(0.68 var(--progress-c) var(--progress-h) / 0.4);
--status-neutral:var(--ink-500);--status-neutral-text:var(--ink-300);--status-neutral-bg:oklch(0.3 0.008 85 / 0.6);--status-neutral-line:var(--ink-700);
--status-attention:oklch(0.68 0.16 32);--status-attention-text:oklch(0.8 0.11 32);--status-attention-bg:oklch(0.68 0.16 32 / 0.14);--status-attention-line:oklch(0.68 0.16 32 / 0.4);

--shadow-xs:none;--shadow-card:0 8px 24px oklch(0 0 0 / 0.35);--shadow-pop:0 16px 40px oklch(0 0 0 / 0.5);--shadow-drawer:-16px 0 48px oklch(0 0 0 / 0.45)}
@media (max-width:1279px){:root{--page-pad-x:24px}}
@media (max-width:767px){:root{--page-pad-x:16px;--page-pad-top:24px}}
html,body{margin:0;min-height:100%;background:var(--bg-canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover);text-decoration:underline;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text-tertiary)}
::selection{background:var(--action-primary-tint)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
@keyframes ai-confetti{0%{transform:translate(0,0) rotate(0deg);opacity:1}40%{transform:translate(calc(var(--dx) * .55),var(--dy)) rotate(calc(var(--r) * .45));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 90vh)) rotate(var(--r));opacity:0}}
@keyframes ai-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ai-pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--status-success) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ai-pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ai-fade{from{opacity:0}to{opacity:1}}
@keyframes ai-skeleton{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes ai-spin{to{transform:rotate(360deg)}}
@keyframes ai-drawer-in{from{transform:translateX(-100%)}to{transform:none}}
</style>
</helmet>
<section aria-label="{{ ariaLabel }}" style="position:relative; display:flex; align-items:center; gap:20px 28px; flex-wrap:wrap; padding:20px 24px; border-radius:14px; border:1px solid var(--line-default); background:var(--bg-surface); box-shadow:var(--shadow-xs)">
  <div style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:8px">
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
      <sc-if value="{{ isLive }}"><span style="display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:6px; background:var(--status-success-bg); border:1px solid var(--status-success-line); color:var(--status-success-text); font-size:12px; font-weight:700; letter-spacing:0.06em"><span style="width:7px; height:7px; border-radius:50%; background:var(--status-success); animation:ai-pulse 1.6s infinite"></span>LIVE</span></sc-if>
      <span style="font-size:14px; font-weight:600; color:var(--text-secondary)">{{ vm.kicker }}</span>
      <sc-if value="{{ isLive }}"><span role="timer" aria-live="off" style="font-family:var(--font-mono); font-size:13px; color:var(--text-tertiary); font-variant-numeric:tabular-nums">{{ vm.elapsed }} Elapsed</span></sc-if>
    </div>
    <div style="font-size:20px; font-weight:600; letter-spacing:-0.015em; line-height:1.3; text-wrap:pretty">Session {{ vm.n }} · {{ vm.title }}</div>
    <div style="display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--text-tertiary); font-size:13px">
      <span>{{ vm.module }}</span><span>{{ vm.when }}</span><span>{{ vm.mins }} Min with {{ vm.instructor }}</span>
    </div>
    <sc-if value="{{ vm.note }}"><div style="display:flex; align-items:center; gap:8px; margin-top:2px; font-size:13px; color:var(--text-secondary)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px; height:15px; flex:none; fill:none; stroke:var(--text-tertiary); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round"><path d="{{ noteIcon }}"></path></svg>{{ vm.note }}</div></sc-if>
  </div>
  <sc-if value="{{ hasCountdown }}">
    <div role="timer" aria-live="off" aria-label="{{ vm.aria }}" style="display:flex; gap:6px">
      <sc-for list="{{ vm.countdown }}" as="u" hint-placeholder-count="4">
        <div style="min-width:58px; padding:8px 6px 6px; border-radius:10px; background:var(--bg-sunken); border:1px solid var(--line-default); text-align:center">
          <div style="font-family:var(--font-mono); font-size:20px; font-weight:500; line-height:1.2; font-variant-numeric:tabular-nums">{{ u.v }}</div>
          <div style="font-size:12px; color:var(--text-tertiary); margin-top:2px">{{ u.l }}</div>
        </div>
      </sc-for>
    </div>
    <span aria-live="polite" style="position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap">{{ vm.aria }}</span>
  </sc-if>
  <div style="display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap">
    <sc-if value="{{ pCal }}">
      <div style="position:relative">
        <button onClick="{{ toggleCal }}" aria-expanded="{{ calOpenStr }}" style="height:36px; padding:0 12px 0 14px; border-radius:8px; border:1px solid transparent; background:var(--action-primary); color:var(--action-on-primary); font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; outline:none" style-hover="background:var(--action-primary-hover)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round"><path d="M13 4.5H8A4.5 4.5 0 0 0 3.5 9V16A4.5 4.5 0 0 0 8 20.5H16A4.5 4.5 0 0 0 20.5 16V12 M19.18 5.82h.01 M8 3v3.2 M13 3v3.2 M3.5 9.8H16 M12 12.8v5 M9.5 15.3h5"></path></svg>Add to Calendar
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:0.8"><path d="M6 9.5l6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{ calOpen }}">
          <div role="menu" style="position:absolute; left:0; top:calc(100% + 6px); z-index:30; width:220px; padding:5px; border-radius:10px; background:var(--bg-raised); border:1px solid var(--line-default); box-shadow:var(--shadow-pop); animation:ai-pop 140ms ease-out">
            <sc-for list="{{ calItems }}" as="ci">
              <button role="menuitem" onClick="{{ ci.go }}" style="display:flex; align-items:center; justify-content:space-between; width:100%; height:34px; padding:0 10px; border:0; border-radius:7px; background:transparent; color:var(--text-primary); font-size:14px; cursor:pointer; text-align:left; white-space:nowrap" style-hover="background:var(--bg-hover)">{{ ci.label }}<span style="color:var(--text-tertiary); font-size:12px">{{ ci.hint }}</span></button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ showJoin }}"><dc-import name="Join Button" mode="{{ joinMode }}" hint="{{ vm.hint }}" url="{{ vm.zoom }}" stack="{{ true }}" on-join="{{ join }}" hint-size="140px,36px"></dc-import></sc-if>
    <sc-if value="{{ pWatch }}">
      <button onClick="{{ watch }}" style="height:36px; padding:0 14px; border-radius:8px; border:1px solid transparent; background:var(--action-primary); color:var(--action-on-primary); font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; outline:none" style-hover="background:var(--action-primary-hover)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px; height:14px; fill:currentColor; stroke:none"><path d="M8 5.3v13.4a1 1 0 0 0 1.5.86l10.9-6.7a1 1 0 0 0 0-1.72L9.5 4.44A1 1 0 0 0 8 5.3z"></path></svg>Watch Replay</button>
    </sc-if>
    <sc-if value="{{ pKit }}">
      <button onClick="{{ kit }}" style="height:36px; padding:0 14px; border-radius:8px; border:1px solid var(--action-secondary-line); background:var(--action-secondary); color:var(--text-primary); font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap; outline:none" style-hover="background:var(--action-secondary-hover)" style-focus="box-shadow:0 0 0 3px var(--focus-ring)">Open the Build Kit</button>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:980,&quot;height&quot;:160},&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;SessionVM (lib.sessionVM)&quot;},&quot;onJoin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCal&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(kind: 'google'|'outlook'|'ics') =&gt; void&quot;},&quot;onWatch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onKit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { calOpen: false, joining: false };
  componentWillUnmount() { clearTimeout(this.jt); }
  renderVals() {
    const p = this.props, vm = p.vm || {};
    const v = vm.variant || 'scheduled';
    const close = () => this.setState({ calOpen: false });
    const cal = k => () => { close(); p.onCal && p.onCal(k); };
    return {
      vm, ariaLabel: `${vm.kicker || 'Session'}: Session ${vm.n || ''}`,
      isLive: !!vm.live, hasCountdown: !!(vm.countdown && vm.countdown.length),
      noteIcon: v === 'ended_processing' ? 'M20.27 8.99A8.8 8.8 0 1 1 15.01 3.73 M18.22 5.78h.01 M12 7.5V12l3 2' : 'M20.27 8.99A8.8 8.8 0 1 1 15.01 3.73 M18.22 5.78h.01 M8.4 12.3l2.5 2.5 4.7-5',
      pCal: vm.primary === 'calendar', pWatch: vm.primary === 'watch', pKit: vm.primary === 'kit',
      showJoin: !!vm.join, joinMode: this.state.joining ? 'loading' : vm.join,
      join: () => { this.setState({ joining: true }); clearTimeout(this.jt); this.jt = setTimeout(() => { this.setState({ joining: false }); p.onJoin && p.onJoin(); }, 900); },
      calOpen: this.state.calOpen, calOpenStr: this.state.calOpen ? 'true' : 'false',
      toggleCal: () => this.setState(s => ({ calOpen: !s.calOpen })),
      calItems: [{ label: 'Google Calendar', hint: 'New Tab', go: cal('google') }, { label: 'Outlook', hint: 'New Tab', go: cal('outlook') }, { label: 'Apple or Other', hint: '.Ics File', go: cal('ics') }],
      watch: () => p.onWatch && p.onWatch(), kit: () => p.onKit && p.onKit(),
    };
  }
}
</script>
</body>
</html>
