     classes) and buyer.dark.css (the learner's Dark theme, as the step page does it). Data: buyer-data.js, generated from the
     repo's catalogs (tools/make-data.ts). One file, six views: #home (default), #library, #skill-<id>, #training,
     #office-hours, #accelerator and #week-<n>. Query: ?bought=owner|agent|two, ?theme=light|dark, ?bar=0 (no MOCKUP bar).

<script>
/* ---------- the buyer and the plans (in the LMS: GET /api/skills, GET /api/offer for each cart's Payment Link) ---------- */
const Q = new URLSearchParams(location.search);
const BOUGHT = { owner: ['team-pnl-review'], agent: ['appointment-follow-up'], two: ['team-pnl-review', 'fub-pipeline-review'] };
let bought = BOUGHT[Q.get('bought')] ? Q.get('bought') : 'owner';
let theme = Q.get('theme') === 'dark' ? 'dark' : 'light';
if (Q.get('bar') === '0') document.getElementById('wkx').hidden = true;
const ME = { first: 'Alex', initials: 'AM' };
const CAT = window.CATALOG;
const skill = id => CAT.find(s => s.id === id);
const owned = () => BOUGHT[bought].map(skill);
const isOwned = s => BOUGHT[bought].includes(s.id);
const isOpen = s => isOwned(s) || s.f === 1;

const SETS = { owner_ops: 'Owner and Operations Skills', agent: 'Agent Skills', both: 'Skills for Everyone' };
const SET_ONE = { owner_ops: 'Owner and Operations Skill', agent: 'Agent Skill', both: 'Skill for Everyone' };
const SET_ORDER = ['owner_ops', 'agent', 'both'];
/* The Insiders upsell, by the skill's set, as the library has it (offer.ts skillUpsell): agent skills open Agent
   Insiders; owner, ops and both open Team Leader Insiders. The href is the cart's PAYMENT_LINK_* from /api/offer. */
const PLANS = {
  leader: { cart: 'insiders-monthly', name: 'Amplified Insiders', chip: 'Amplified Insiders', who: 'For team leaders', amount: '$169', terms: '3-Month Minimum.',
    button: 'Upgrade to Amplified Insiders, $169/Month', short: 'Upgrade to Amplified Insiders', line: 'Every owner, ops and agent skill, plus weekly office hours.',
    checks: ['Every owner, ops and agent skill', 'Weekly office hours, Thursdays at 12:00 PM MT', 'New skills and updates as they come out'],
    every: 'Open Every Skill in the Library', getAll: 'Get This Skill and Every Other One', opens: () => true },
  agent: { cart: 'insiders-agent-monthly', name: 'Amplified Insiders for Agents', chip: 'Agent Insiders', who: 'For agents', amount: '$79', terms: '3-Month Minimum. No weekly live training.',
    button: 'Upgrade to Agent Insiders, $79/Month', short: 'Upgrade to Agent Insiders', line: 'Every agent skill, plus weekly office hours.',
    checks: ['Every agent skill', 'Weekly office hours, Thursdays at 12:00 PM MT'],
    every: 'Open Every Agent Skill', getAll: 'Get This Skill and Every Agent Skill', opens: s => s.s !== 'owner_ops' } };
const planFor = sets => (sets === 'agent' ? PLANS.agent : PLANS.leader);
const myPlan = () => planFor(owned().some(s => s.s !== 'agent') ? 'owner_ops' : 'agent');
/* Weekly live training: the Agent Plan's cart (offer.ts AGENT_TRAINING, agents/content.ts ROTATION, site/offers-content.ts AGENT_PLAN). */
const AGENT_PLAN = { cart: 'agent-monthly', name: 'Amplified Agent Plan', amount: '$117', button: 'Upgrade to the Agent Plan, $117/Month',
  body: '3-Month Minimum. Every agent skill, plus weekly live training, plus office hours.',
  lines: ['Every agent skill', 'A short recorded starter path for your first week', 'One live training a week, 60 minutes', 'Weekly office hours, 60 minutes on Thursdays'] };
const ROTATION = [
  { n: 1, topic: 'Leads and Follow-Up', skills: ['speed-to-lead-reply', 'sphere-touch-plan', 'open-house-follow-up'] },
  { n: 2, topic: 'Listings', skills: ['pricing-conversation-prep', 'listing-description-writer', 'seller-listing-update'] },
  { n: 3, topic: 'Buyers and Contracts', skills: ['offer-strategy', 'due-diligence-review', 'counter-explainer'] },
  { n: 4, topic: 'Content and Your Week', skills: ['content-opportunity-research', 'perfect-week', 'appointment-follow-up'] } ];
/* The AI Accelerator: the v3 mockup's weeks, Week 0's steps and each week's line and live build, word for word. */
const WEEKS = ['Foundations', 'Where the Money Goes', 'Leads That Pay', 'Numbers on the 5th', 'Protect the Pipeline', 'Coach from Evidence', 'Delegate an Outcome', 'Make the Workflow Repeatable', 'Sustain and Expand'];
const WEEK_D = [null,
  ['See every dollar of GCI on one chart, and what each gap costs you a year.', 'Map Your Spend Live Build'],
  ['Know which lead sources pay you back, and catch every new lead that isn’t worked to standard.', 'Lead Source Review Live Build'],
  ['Get last month’s numbers against your standard every month, without anyone building a spreadsheet.', 'Monthly Numbers Live Build'],
  ['A ranked list of where deals are slipping, each with a record reference and a next step.', 'FUB Pipeline Review Live Build'],
  ['A coaching packet that keeps facts, hypotheses and questions apart, and one agreed behavior to change.', 'Agent 1:1 Prep Live Build'],
  ['One recurring deliverable off the owner’s desk, with a responsibility card and a review checklist.', 'Team Playbook Builder Live Build'],
  ['A versioned onboarding skill your operator can explain, test and repair without the instructor.', 'New Agent Onboarding Plan Live Build'],
  ['A cohort-end review: what stays, what stops, and a 90-day plan your team runs without us.', 'Cohort-End Review Live Build'] ];
const STEPS0 = [
  ['Fill In Your Intake and Name Your Operator', 'Owner', '10 min'], ['Watch the Orientation', 'Owner and operator', '30 min'],
  ['Start Your Time Baseline', 'Owner', '20 min, over two weeks'], ['Get Your AI Ready', 'Operator', '20 min'],
  ['Set Up Your AI Brain', 'Each of you', '30 min'], ['Connect Your Data', 'Operator', '30 min'],
  ['Lock the Guardrails', 'Operator', '10 min'], ['Run the Ready Check and Your Test Hire', 'Operator', '20 min, plus a next-morning check'] ];
const SUPPORT = 'support@amplifiedimpact.io';

/* ---------- helpers (the v3 mockup's) ---------- */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const roll = t => `<span class="aim-roll"><span>${t}</span><span aria-hidden="true">${t}</span></span>`;
const ic = (n, s = 14, c = '') => `<svg${c ? ` class="${c}"` : ''} width="${s}" height="${s}" aria-hidden="true"><use href="#k-${n}"/></svg>`;
const CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const tools = s => s.files.includes('chatgpt') ? 'Claude or ChatGPT' : s.files.includes('grok') ? 'Grok Bot' : 'Claude';
const LANE = { claude: 'Claude', chatgpt: 'ChatGPT', grok: 'Grok Bot' };
const DL = { claude: 'Download for Claude', chatgpt: 'Download for ChatGPT', grok: 'Download for Grok Bot', practice: 'Practice Files' };
const lockedPill = `<span class="wk-open" data-s="locked">${ic('lock', 12)}Locked</span>`;
const stLocked = `<span class="wk-st" data-s="locked">${ic('lock', 12)}Locked</span>`;
const crumbs = (...xs) => `<nav class="wk-crumbs aim-rise" style="--i:0" aria-label="Breadcrumb"><a href="#home">Home</a>${xs.map((x, i) => `<span aria-hidden="true">/</span>${i < xs.length - 1 ? `<a href="${x[1]}">${esc(x[0])}</a>` : `<span>${esc(x[0])}</span>`}`).join('')}</nav>`;
const tag = (i, t) => `<span class="wk-tag">${ic(i)}${esc(t)}</span>`;
const help = i => `<section class="wk-card aim-rise" style="--i:${i}" aria-label="Questions"><div class="wk-help"><b>Questions?</b><a class="wk-mail" href="mailto:${SUPPORT}">${SUPPORT}</a></div></section>`;
const checks = xs => `<ul class="by-checks">${xs.map(x => `<li>${CHECK}<span>${esc(x)}</span></li>`).join('')}</ul>`;
const nb = t => esc(t).replace('3-Month Minimum.', '<span class="by-nb">3-Month Minimum.</span>');
const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };

/* the one upgrade card: the plan, its price, what it opens and its button */
function upCard(plan, i, { button = true, keep = true } = {}){
  const mine = owned();
  const keepLine = keep ? [mine.length === 1 ? `${mine[0].t} stays yours` : 'The skills you bought stay yours'] : [];

const marker = $('sh-marker'), scroller = $('sh-scroll');
function placeMarker(){ const a = scroller.querySelector('[aria-current="page"]'); const r = a && a.offsetParent ? a.getBoundingClientRect() : null, o = scroller.getBoundingClientRect();
  marker.style.setProperty('--y', (r ? r.top - o.top + scroller.scrollTop : 0) + 'px'); marker.style.setProperty('--h', (r ? r.height : 0) + 'px'); }
function setCurrent(id){ document.querySelectorAll('.sh-link[data-nav]').forEach(a => a.dataset.nav === id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); placeMarker(); }
function placeThumb(){ const seg = $('lane-seg'); if (!seg) return; const b = seg.querySelector('[aria-checked="true"]'), th = seg.querySelector('.wk-seg-thumb');
  th.style.setProperty('--x', b.offsetLeft + 'px'); th.style.setProperty('--w', b.offsetWidth + 'px'); }
function wire(){
  document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { b.closest('.by-set').querySelector('.by-list').dataset.all = 'true'; b.parentElement.remove(); });
  const seg = $('lane-seg'); if (!seg) return; const bs = [...seg.querySelectorAll('.wk-seg-b')];
  const pick = (b, focus) => { bs.forEach(x => { const on = x === b; x.setAttribute('aria-checked', on); x.tabIndex = on ? 0 : -1; }); if (focus) b.focus();
    document.querySelectorAll('[data-lane-list]').forEach(l => l.hidden = l.dataset.laneList !== b.dataset.lane); placeThumb(); };
  bs.forEach((b, i) => { b.onclick = () => pick(b); b.onkeydown = e => { const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0; if (!d) return; e.preventDefault(); pick(bs[(i + d + bs.length) % bs.length], true); }; });
  placeThumb(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { placeThumb(); requestAnimationFrame(() => requestAnimationFrame(() => seg.querySelector('.wk-seg-thumb').classList.add('live'))); });
}
const HERE = { home: 'Home', library: 'Skill Library', training: 'Weekly Live Training', 'office-hours': 'Office Hours', accelerator: 'AI Accelerator' };
function route(){
  const h = location.hash.slice(1) || 'home', sk = /^skill-(.+)$/.exec(h), wk = /^week-([0-8])$/.exec(h);
  const view = sk ? 'skill' : wk || h === 'accelerator' ? 'accelerator' : HERE[h] ? h : 'home';
  const html = view === 'skill' ? viewSkill(sk[1]) : view === 'library' ? viewLibrary() : view === 'training' ? viewTraining() : view === 'office-hours' ? viewOffice() : view === 'accelerator' ? viewAccel() : viewHome();
  $('main').innerHTML = `<div data-ai="${view}">${html}</div>`;
  $('sh-next').hidden = view === 'home';   /* Home's hero already is the buyer's skill, as the Schedule's hero is the next session */
  setCurrent(view === 'skill' ? 'library' : view === 'accelerator' ? `week-${wk ? wk[1] : 0}` : view);
  $('sh-here').textContent = view === 'skill' ? (skill(sk[1]) || {}).t || 'Skill Library' : HERE[view];
  $('sh-side').removeAttribute('data-open'); $('sh-menu').setAttribute('aria-expanded', 'false');
  wire();
  if (wk && +wk[1] > 0) requestAnimationFrame(() => $(`wk-row-${wk[1]}`)?.scrollIntoView({ block: 'start' })); else if (!Q.get('keep-scroll')) scrollTo(0, 0);
  document.body.dataset.appReady = 'true';
}
$('sh-group').onclick = e => { const b = e.currentTarget, open = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', open); $('sh-weeks').hidden = !open; placeMarker(); };
const app = $('sh-app'), cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim(), cssMs = v => parseFloat(cssVar(v));
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const movers = () => [...app.querySelectorAll('.sh-side .sh-link>svg:first-child,.sh-wn')], rectsOf = () => movers().map(el => el.getBoundingClientRect());
function flip(before, dur, ease){ movers().forEach((el, i) => { el.getAnimations().forEach(a => a.cancel()); const a = before[i], b = el.getBoundingClientRect(); if (!a || !a.width || !b.width) return; const dx = a.left - b.left, dy = a.top - b.top; if (!dx && !dy) return;
  try { el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: cssMs(dur), easing: cssVar(ease) }); } catch (err) {} }); }
let collapseT = 0, swapT = 0;
function setCollapsed(on){ const btn = $('sh-collapse'); clearTimeout(collapseT); clearTimeout(swapT);
  btn.setAttribute('aria-pressed', on); btn.querySelector('.sh-label').textContent = on ? 'Expand sidebar' : 'Collapse sidebar';
  const settle = () => { clearTimeout(collapseT); clearTimeout(swapT); if (app.dataset.narrow === 'true') app.dataset.collapsed = true; app.removeAttribute('data-anim'); placeMarker(); placeThumb(); };
  if (reduce() || innerWidth <= 900){ app.dataset.narrow = app.dataset.collapsed = on; return settle(); }
  app.ontransitionend = e => { if (e.target === app && e.propertyName === 'grid-template-columns') settle(); };
  if (on){ app.dataset.narrow = true; app.dataset.anim = 'collapsing';
    swapT = setTimeout(() => { const before = rectsOf(); app.dataset.collapsed = true; placeMarker(); flip(before, '--aim-dur-base', '--aim-ease'); }, cssMs('--aim-dur-quick'));
    collapseT = setTimeout(settle, cssMs('--aim-dur-move') + 80);
  } else { const before = app.dataset.collapsed === 'true' ? rectsOf() : null;
    app.dataset.collapsed = app.dataset.narrow = false; app.dataset.anim = 'expanding'; placeMarker();
    if (before) flip(before, '--aim-dur-move', '--aim-ease');
    collapseT = setTimeout(settle, cssMs('--aim-dur-spring') + 80); }
}
$('sh-collapse').onclick = () => setCollapsed(app.dataset.narrow !== 'true');
$('sh-menu').onclick = e => { const open = $('sh-side').dataset.open !== 'true'; $('sh-side').dataset.open = open; e.currentTarget.setAttribute('aria-expanded', open); placeMarker(); };
new ResizeObserver(() => { placeMarker(); placeThumb(); }).observe(document.body);

/* ---------- the MOCKUP bar (review-only) ---------- */
function setTheme(t){ theme = t; document.documentElement.dataset.theme = t; document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === t)); }
function setBought(b){ bought = b; document.querySelectorAll('[data-bought]').forEach(x => x.setAttribute('aria-pressed', x.dataset.bought === b)); renderShell(); route(); }
document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
document.querySelectorAll('[data-bought]').forEach(b => b.onclick = () => setBought(b.dataset.bought));
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
addEventListener('hashchange', route);
setTheme(theme); setBought(bought);
</script>
</body>
