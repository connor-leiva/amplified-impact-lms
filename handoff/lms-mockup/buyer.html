     An extension of the LMS v3 mockup (handoff/lms-v3/mockup/index.html, revision v7, D-225), which stays as it is.
     Looks: that mockup's own stylesheets, unchanged (handoff/lms-v3/src/lms.tokens.css and lms.css, generated from it, the
     files the app ships), its icons and its logo. What the buyer's pages add is buyer.css (built from the same tokens and
     classes). Light only, as the v3 member pages are (D-226; Connor, Nov 24: "Light only is fine"). Data: buyer-data.js,
     generated from the repo's catalogs and the build's own buyer content (tools/make-data.ts), so the mockup and the build
     say the same words. One file, six views: #home (default), #library, #skill-<id>, #training, #office-hours,
     #accelerator and #week-<n>. Query: ?bought=owner|agent|two, ?bar=0 (no MOCKUP bar).
     Review-only, not shipped: the black MOCKUP bar. -->

<script src="buyer-data.js"></script>
<script>
/* ---------- the buyer and the plans (in the LMS: GET /api/skills, GET /api/offer for each cart's Payment Link) ----------
   Every word below that the build also says comes from window.BUYER (the build's apps/web/src/routes/learn/buyer/content.ts)
   or window.CATALOG (the catalogs, leads and guides), both written by tools/make-data.ts. */
const Q = new URLSearchParams(location.search);
const BOUGHT = { owner: ['team-pnl-review'], agent: ['appointment-follow-up'], two: ['team-pnl-review', 'fub-pipeline-review'] };
let bought = BOUGHT[Q.get('bought')] ? Q.get('bought') : 'owner';
if (Q.get('bar') === '0') document.getElementById('wkx').hidden = true;
const ME = { first: 'Alex', initials: 'AM' };
const CAT = window.CATALOG, B = window.BUYER;
const PLANS = B.plans, AGENT_PLAN = B.agentPlan, TRAINING = B.training, OFFICE = B.office, ACCEL = B.accel, OUTLINE = B.outline;
const skill = id => CAT.find(s => s.id === id);
const owned = () => BOUGHT[bought].map(skill);
const isOwned = s => BOUGHT[bought].includes(s.id);
const isOpen = s => isOwned(s) || s.f === 1;
const slugOf = s => s.id === 'content-opportunity-research' ? 'content-strategist' : s.id;

const SETS = { owner_ops: 'Owner and Operations Skills', agent: 'Agent Skills', both: 'Skills for Everyone' };
const SET_ONE = { owner_ops: 'Owner and Operations Skill', agent: 'Agent Skill', both: 'Skill for Everyone' };
const SET_ORDER = ['owner_ops', 'agent', 'both'];
/* The Insiders upsell follows the skill's set (offer.ts skillUpsell): agent skills open Agent Insiders; owner, ops and
   both open Team Leader Insiders. */
const planFor = sets => (sets === 'agent' ? PLANS.agent : PLANS.leader);
const myPlan = () => (owned().some(s => s.s !== 'agent') ? PLANS.leader : PLANS.agent);
const opensWith = plan => CAT.filter(x => !isOpen(x) && (plan.key === 'leader' || x.s !== 'owner_ops')).length;
const SUPPORT = 'support@amplifiedimpact.io';
const MINIMUM = '3-Month Minimum.';

/* ---------- helpers (the v3 mockup's) ---------- */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const roll = t => `<span class="aim-roll"><span>${t}</span><span aria-hidden="true">${t}</span></span>`;
const ic = (n, s = 14, c = '') => `<svg${c ? ` class="${c}"` : ''} width="${s}" height="${s}"><use href="#k-${n}"/></svg>`;
const CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
/* the AI apps a skill's files are for, as the Skill Library says it (Library.vm.ts platformsOf) */
const tools = s => { const n = [['grok', 'Grok Bot'], ['claude', 'Claude'], ['chatgpt', 'ChatGPT']].filter(([k]) => s.files.includes(k)).map(x => x[1]); return n.length <= 1 ? (n[0] || '') : `${n.slice(0, -1).join(', ')} or ${n[n.length - 1]}`; };
const DL = { claude: 'Download for Claude', chatgpt: 'Download for ChatGPT', grok: 'Download for Grok Bot', practice: 'Practice Files' };
const dlsOf = s => ['claude', 'chatgpt', 'grok', 'practice'].filter(k => s.files.includes(k));
const nb = t => esc(t).replace(MINIMUM, `<span class="by-nb">${MINIMUM}</span>`);
const lockedPill = `<span class="wk-open" data-s="locked">${ic('lock', 12)}Locked</span>`;
const stLocked = `<span class="wk-st" data-s="locked">${ic('lock', 12)}Locked</span>`;
const crumbs = (...xs) => `<nav class="wk-crumbs aim-rise" style="--i:0" aria-label="Breadcrumb"><a href="#home">Home</a>${xs.map(x => `<span aria-hidden="true">/</span>${x[1] ? `<a href="${x[1]}">${esc(x[0])}</a>` : `<span>${esc(x[0])}</span>`}`).join('')}</nav>`;
const tag = (i, t) => `<span class="wk-tag">${ic(i)}${esc(t)}</span>`;
const help = i => `<section class="wk-card aim-rise" style="--i:${i}" aria-label="Questions"><div class="wk-help"><b>Questions?</b><a class="wk-mail" href="mailto:${SUPPORT}">${SUPPORT}</a></div></section>`;
const checks = xs => `<ul class="by-checks">${xs.map(x => `<li>${CHECK}<span>${esc(x)}</span></li>`).join('')}</ul>`;
const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
const pay = (cart, cls, label) => `<a class="${cls}" href="#" onclick="return false" data-cart="${cart}">${roll(esc(label))}</a>`;

/* the one upgrade card: the plan, its price, what it opens and its button */
function upCard(plan, i, { button = true } = {}){
  const mine = owned(), keep = mine.length === 1 ? `${mine[0].t} stays yours` : 'The skills you bought stay yours';
  return `<section class="wk-card aim-rise" style="--i:${i}" aria-labelledby="up-h-${i}">
    <div class="by-up-h"><p class="wk-label">${esc(plan.who)}</p><h2 class="wk-h3" id="up-h-${i}">${esc(plan.name)}</h2>
      <p class="by-price"><b>${plan.amount}</b>a month</p><p class="by-terms">${esc(plan.terms)}</p></div>
    ${checks([...plan.checks, keep])}
    ${button ? `<div class="wk-kit-foot">${pay(plan.cart, 'wk-btn wk-btn-primary by-wrap', plan.short)}</div>` : ''}
  </section>`;
}

/* ---------- views ---------- */
function viewHome(){
  const mine = owned(), s = mine[0], plan = myPlan(), two = mine.length > 1;
  const locked = CAT.filter(x => !isOpen(x)).length, opens = opensWith(plan);
  const next = CAT.filter(x => x.s === s.s && !isOpen(x)).slice(0, 3);
  const rows = [
    ['grid', 'Every Other Skill', opens === locked ? `${locked} more skills, each with its Setup Guide to preview.` : `${locked} more skills to preview. ${plan.chip} opens ${opens} of them.`, plan.chip, '#library'],
    ['users', 'Office Hours', OFFICE.body, plan.chip, '#office-hours'],
    ['radio', 'Weekly Live Training', 'One 60 minute session a week, building one skill live on a real file.', 'Agent Plan', '#training'] ];
  /* the AI Accelerator, from the course's own outline (GET /api/course answers a buyer with it) */
  const week0 = OUTLINE.find(w => w.week === 0), last = Math.max(0, ...OUTLINE.map(w => w.week));
  if (week0) rows.push(['flag', `Week 0: ${week0.title}`, week0.question, 'AI Accelerator', '#week-0']);
  if (last > 0) rows.push(['layers', `AI Hires, Weeks 1 to ${last}`, 'Each week answers one question about your business and adds one AI employee.', 'AI Accelerator', '#week-1']);
  return `<div class="wk-page">
    <header class="wk-head aim-rise" style="--i:0"><h1 class="wk-h1">${greeting()}, ${ME.first}</h1>
      <p class="wk-purpose">${two ? 'Your skills are ready. Open a Setup Guide to add one to Claude or ChatGPT.' : 'Your skill is ready. Open its Setup Guide to add it to Claude or ChatGPT.'}</p></header>
    <section class="wk-hero aim-rise" style="--i:1" aria-label="Your skill">
      <div class="wk-hero-main"><p class="wk-kick">${two ? `Your skills · 1 of ${mine.length}` : 'Your skill'}</p><h2 class="wk-hero-t">${esc(s.t)}</h2>
        <p class="wk-hero-m"><span>${tools(s)}</span><span>${esc(s.role)}</span></p>
        <p class="wk-hero-d"><b>What it does</b>${esc(s.o)}</p>
        <div class="wk-hero-acts"><a class="wk-btn wk-btn-accent wk-btn-lg wk-btn-arrow" href="#" onclick="return false">${roll('Open the Setup Guide')}${ic('arrow', 16, 'wk-arrow')}</a>${two ? `<a class="wk-btn wk-btn-onforest wk-btn-lg wk-btn-arrow" href="#library">${roll('See All Your Skills')}${ic('arrow', 16, 'wk-arrow')}</a>` : ''}</div></div>
      <div class="wk-prog"><p class="wk-prog-l">${ic('down')}Downloads</p>

  const settle = () => { clearTimeout(collapseT); clearTimeout(swapT); if (app.dataset.narrow === 'true') app.dataset.collapsed = true; app.removeAttribute('data-anim'); placeMarker(); placeThumb(); };
  if (reduce() || innerWidth <= 900){ app.dataset.narrow = app.dataset.collapsed = on; return settle(); }
  app.ontransitionend = e => { if (e.target === app && e.propertyName === 'grid-template-columns') settle(); };
  if (on){ app.dataset.narrow = true; app.dataset.anim = 'collapsing';
    swapT = setTimeout(() => { const before = rectsOf(); app.dataset.collapsed = true; placeMarker(); flip(before, '--aim-dur-base', '--aim-ease'); }, cssMs('--aim-dur-quick'));
    collapseT = setTimeout(settle, cssMs('--aim-dur-move') + 80);
  } else { const before = app.dataset.collapsed === 'true' ? rectsOf() : null;
    app.dataset.collapsed = app.dataset.narrow = false; app.dataset.anim = 'expanding'; placeMarker();
    if (before) flip(before, '--aim-dur-move', '--aim-ease');
    collapseT = setTimeout(settle, cssMs('--aim-dur-spring') + 80); }
}
$('sh-collapse').onclick = () => setCollapsed(app.dataset.narrow !== 'true');
$('sh-menu').onclick = e => { const open = $('sh-side').dataset.open !== 'true'; $('sh-side').dataset.open = open; e.currentTarget.setAttribute('aria-expanded', open); placeMarker(); };
new ResizeObserver(() => { placeMarker(); placeThumb(); }).observe(document.body);

/* ---------- the MOCKUP bar (review-only) ---------- */
function setBought(b){ bought = b; document.querySelectorAll('[data-bought]').forEach(x => x.setAttribute('aria-pressed', x.dataset.bought === b)); renderShell(); route(); }
document.querySelectorAll('[data-bought]').forEach(b => b.onclick = () => setBought(b.dataset.bought));
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
addEventListener('hashchange', route);
setBought(bought);
</script>
