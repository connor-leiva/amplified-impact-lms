name: ci
# Railway's "Wait for CI" only sees workflows that run on `push`, so `push: main` is required.
on:
  push: { branches: [main] }
  pull_request:
# Block style, not a flow mapping: inside `{ … }` the `}}` of a ${{ }} expression closes the map
# early and the file is rejected as invalid YAML.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  goldens: # proves the goldens are exactly what the reference renders, and nothing else
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: pnpm compliance:capture
      - name: Goldens must be reproducible from the reference
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --exit-code -- compliance/goldens; then
            echo "Goldens reproduce exactly from design-reference/."
            exit 0
          fi
          echo "::error::compliance/goldens does not match what the reference renders in this container."
          echo ""
          echo "Two possible causes:"
          echo "  1. The committed set was captured on another platform. Chromium rasterizes text"
          echo "     slightly differently per OS, so a developer's Windows or macOS capture will not"
          echo "     byte-match this Linux container. See DECISIONS.md D-001."
          echo "     Fix: download the 'goldens-from-container' artifact below, replace"
          echo "     compliance/goldens with it, set PROVENANCE.txt to 'platform: container',"
          echo "     and commit. That set is then authoritative."
          echo "  2. Someone edited compliance/goldens by hand, or design-reference/ changed."
          echo "     Hand-edited goldens are never allowed (CLAUDE.md). If the reference really"
          echo "     changed, re-capture and commit it in the same PR as that change."
          echo ""
          echo "Files that differ:"
          git diff --stat -- compliance/goldens
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-from-container
          path: compliance/goldens
          retention-days: 14

  harness: # Gate 0: the reference drives cleanly under frozen conditions
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: pnpm harness

  compliance:
    needs: quality
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      # .phase records the highest shipped phase. Parity runs every scenario at or below it,
      # so CI is green per phase and turns red the moment a shipped phase regresses.
      - id: phase
        run: echo "gate=$(cat .phase)" >> "$GITHUB_OUTPUT"
      - run: pnpm compliance && pnpm e2e
        env:
          GATE: ${{ steps.phase.outputs.gate }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compliance-report, path: compliance/report }
  api: # Gate 7: the migration and (later) the oracle tests, against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_lms_test
        ports: ['5432:5432']
        # Without this the first migrate can reach the container before Postgres accepts
        # connections, which fails the job for a reason that has nothing to do with the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_lms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      # The migration is generated from schema.ts and cannot be verified without a server, so this
      # is the only place that proves it applies. Running it twice proves it is idempotent, which
      # is what a redeploy does.
      - run: pnpm --filter @ai/api db:migrate
      - run: pnpm --filter @ai/api db:migrate
      - run: pnpm --filter @ai/api test
