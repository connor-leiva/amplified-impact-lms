name: ci
# Railway's "Wait for CI" only sees workflows that run on `push`, so `push: main` is required.
on:
  push: { branches: [main] }
  pull_request:
# Block style, not a flow mapping: inside `{ … }` the `}}` of a ${{ }} expression closes the map
# early and the file is rejected as invalid YAML.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # NOT `pnpm test`. That is `pnpm -r test`, which includes apps/api — and apps/api's suite
      # resolves DATABASE_URL at IMPORT time (test/helpers.ts:99 is module scope, not a hook), so
      # 16 of its 31 files throw DatabaseConfigError during collection on a runner with no
      # Postgres. This job deliberately has no infrastructure; the api suite has its own job below
      # with a real postgres:18 service, and running it here as well only duplicated that work.
      #
      # Deliberately NOT fixed by making those tests skip without a database: a suite that skips
      # when DATABASE_URL goes missing is a suite that reports green while testing nothing, and
      # the `api` job losing its service is exactly the case that has to stay loud.
      - run: pnpm --filter @ai/core --filter @ai/web test

  goldens: # proves the goldens are exactly what the reference renders, and nothing else
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      # Pinned, not inferred: a runner that moved to another OS would otherwise capture into a
      # different platform directory, leave the authoritative Linux set untouched, and still pass
      # its own diff check.
      - run: pnpm compliance:capture
        env:
          GOLDEN_PLATFORM: linux
      - name: Goldens must be reproducible from the reference
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --exit-code -- compliance/goldens; then
            echo "Goldens reproduce exactly from design-reference/."
            exit 0
          fi
          echo "::error::compliance/goldens does not reproduce from the reference in this container."
          echo ""
          echo "Screenshots are per platform and fingerprints are shared (compliance/lib/goldens.ts"
          echo "explains why, with the measurements), so read WHICH files differ before anything else:"
          echo ""
          echo "  compliance/goldens/*.json differ  ->  the COPY or TYPOGRAPHY moved. Fingerprints are"
          echo "     platform-independent, so this is a real change to design-reference/ or a"
          echo "     hand-edited golden. Hand-editing is never allowed (CLAUDE.md). If the reference"
          echo "     genuinely changed, re-capture and commit it in the same PR as that change."
          echo ""
          echo "  compliance/goldens/linux/*.png differ  ->  the authoritative screenshots no longer"
          echo "     reproduce. Either design-reference/ changed, or someone edited them by hand, or"
          echo "     the container image moved. Download the 'goldens-from-container' artifact below,"
          echo "     check the .json files in it are unchanged first, then replace"
          echo "     compliance/goldens/linux/ with it and commit."
          echo ""
          echo "  compliance/goldens/win32/*.png differ  ->  should be impossible: this job pins"
          echo "     GOLDEN_PLATFORM=linux and never writes that directory. If it happens, the"
          echo "     capture is ignoring the platform setting."
          echo ""
          echo "Files that differ:"
          git diff --stat -- compliance/goldens
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-from-container
          path: compliance/goldens
          retention-days: 14

  harness: # Gate 0: the reference drives cleanly under frozen conditions
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: pnpm harness

  compliance:
    needs: quality
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      # .phase records the highest shipped phase. Parity runs every scenario at or below it,
      # so CI is green per phase and turns red the moment a shipped phase regresses.
      - id: phase
        run: echo "gate=$(cat .phase)" >> "$GITHUB_OUTPUT"
      - run: pnpm compliance && pnpm e2e && pnpm e2e:v3
        env:
          GATE: ${{ steps.phase.outputs.gate }}
          # `.phase` is 9, and GATE >= 7 turns http parity ON (compliance/lib/prepare.ts) — which
          # starts a second server and makes global-setup truncate and re-seed a Postgres. This
          # job has no `services:` block and no DATABASE_URL, so global-setup would throw before
          # the first test ran. It has never been observed because `needs: quality` meant this job
          # was skipped, not run.
          #
          # '0' is prepare.ts's documented hard override, and it also makes the @g7 sign-in e2e
          # specs skip themselves rather than fail, because LIVE_API_BASE becomes null.
          #
          # COVERAGE GAP, on purpose and temporarily: the 24 http-mode parity scenarios now run
          # only in the local gate. Restoring them in CI needs a job with a postgres service
          # inside this container — where the service is reached as `postgres:5432`, NOT
          # `localhost:5432` as the `api` job does, because a container job talks to services over
          # the Docker network. That is a change worth making on its own, not bundled into a fix
          # whose job is to unblock deploys.
          HTTP_PARITY: '0'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compliance-report, path: compliance/report }
  # The learner parity suite (Connor's parity brief § 3): every test tagged @parity:<ID>, then the meta-test
  # over compliance/parity/learner-parity.json. Built and served as the `compliance` job builds and serves
  # the app (the fixture build, plus the suite's own http-mode build, both started by
  # compliance/parity/learner.config.ts). Its exit code is what the flip's build guard relies on.
  #
  # NO `needs:`, on purpose. GitHub reports a job skipped because a job it needs failed as a success to
  # branch protection, so a red `quality` would turn this required check green without running it.
  # Making it required is a branch-protection setting on GitHub, not something this file can do.
  #
  # D-182: KEEP THE JOB'S ID. `parity-learner` is the check name the build guard reads from GitHub
  # (apps/web/src/build/learner-parity-guard.ts): a production build with VITE_LEARNER_V2=true goes on only
  # when this job succeeded on its commit, and a rename would make every flag-on build fail closed. The
  # suite runs against what ships, the flag-on build; today's portal keeps its parity in `compliance`.
  parity-learner:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: pnpm parity:learner
        env:
          # As in `compliance`: this job has no Postgres, so http parity against the real API stays off.
          # The suite's http-mode specs answer /api/* themselves (compliance/tests/parity/http/).
          HTTP_PARITY: '0'
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: parity-learner-results, path: compliance/parity/results, retention-days: 14 }

  api: # Gate 7: the migration and (later) the oracle tests, against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # 18, not the 16 the phase file names: Railway provisioned PostgreSQL 18.6 for this
        # project, and CI is only worth having if it runs the same major version as production.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_lms_test
        ports: ['5432:5432']
        # Without this the first migrate can reach the container before Postgres accepts
        # connections, which fails the job for a reason that has nothing to do with the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_lms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      # The migration is generated from schema.ts and cannot be verified without a server, so this
      # is the only place that proves it applies. Running it twice proves it is idempotent, which
      # is what a redeploy does.
      - run: pnpm --filter @ai/api db:migrate
      - run: pnpm --filter @ai/api db:migrate
      - run: pnpm --filter @ai/api test
