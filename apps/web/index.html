<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amplified Impact Academy</title>
    <!-- The brand's favicon drawing (D-031), inline so it costs no request against the per-IP rate
         limit. Forest tile, Cream "ai", Energy Bright dot; the same in both themes. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-16.89 5.65 110.95 110.95%22 width=%2232%22 height=%2232%22%3E%3Crect x=%22-16.89%22 y=%225.65%22 width=%22110.95%22 height=%22110.95%22 rx=%2224.41%22 fill=%22%231F4D40%22%3E%3C/rect%3E%3Cpath d=%22M7.5 75a18.25 18.25 0 1 0 36.5 0a18.25 18.25 0 1 0 -36.5 0ZM44 50V100M69.66 50V100%22 fill=%22none%22 stroke=%22%23F4F2EC%22 stroke-width=%2215%22%3E%3C/path%3E%3Ccircle cx=%2269.66%22 cy=%2232%22 r=%2210.5%22 fill=%22%236FD3A5%22%3E%3C/circle%3E%3C/svg%3E" />
    <!-- Pre-paint theme script (mirrors the reference's helmet). Reads localStorage['ai-lms-prefs']
         and sets data-theme before first paint, so there is no theme flash. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('ai-lms-prefs') || '{}'),
          d = document.documentElement;
        d.dataset.theme = p.theme === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
