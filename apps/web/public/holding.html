<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amplified Impact</title>
    <meta name="description" content="Amplified Impact — site under construction." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-16.89 5.65 110.95 110.95%22 width=%2232%22 height=%2232%22%3E%3Crect x=%22-16.89%22 y=%225.65%22 width=%22110.95%22 height=%22110.95%22 rx=%2224.41%22 fill=%22%231F4D40%22%3E%3C/rect%3E%3Cpath d=%22M7.5 75a18.25 18.25 0 1 0 36.5 0a18.25 18.25 0 1 0 -36.5 0ZM44 50V100M69.66 50V100%22 fill=%22none%22 stroke=%22%23F4F2EC%22 stroke-width=%2215%22%3E%3C/path%3E%3Ccircle cx=%2269.66%22 cy=%2232%22 r=%2210.5%22 fill=%22%236FD3A5%22%3E%3C/circle%3E%3C/svg%3E" />
    <!--
      A placeholder for www, served by `apps/api/src/routes/marketing.ts` while the real marketing
      page is designed. Rebranded to the finished brand in D-031.

      SELF-CONTAINED ON PURPOSE. No script, no stylesheet, no font file, no image file — the whole
      page is one response:

        1. § 9.4's CSP restricts `script-src` to hashed inline scripts, and this page is not in the
           hash list (server.ts hashes index.html and ai101.html). So the logo intro below is CSS
           only — a script here would be silently blocked, not merely unhashed.
        2. The brand font's files are build-hashed. Pointing a hand-written page at them couples it
           to vite's output; a system stack costs a placeholder nothing, and the brand is carried
           by the logo, which is artwork and never typed.
        3. `style-src` carries 'unsafe-inline' (see app.ts), so the inline <style> and the logo's
           own transform-origin attributes are allowed rather than special-cased.

      The colours are the brand guide's hex, written here directly, because this page deliberately
      does not load tokens.css. Light: Cream ground, white card, Ink letters, Forest link. Dark:
      Ink ground, Cream letters, Energy Bright link and hero dot — the guide's "Reversed" treatment.
      Dark follows prefers-color-scheme, which is right HERE and only here: a public page has no
      stored app preference to follow.

      The logo is the brand package's own signature drawing, generated by its logo/source/build.js
      with motion tags on the hero dot, ring and echo — the same paths, positions and colours as the
      official export. The intro is the guide's: the dot lands with a slight overshoot by 220 ms,
      the ring expands by 480 ms, one echo fades by 900 ms, eased with cubic-bezier(.2,.7,.2,1). It
      plays ONCE ("never loop or pulse the ring, because it reads as a notification") and is skipped
      entirely under prefers-reduced-motion, which shows the final frame.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f2ec;
        --surface: #ffffff;
        --line: #e2ded4;
        --ink: #15211d;
        --muted: #5b6762;
        --link: #1f4d40;
        --link-hover: #15211d;
        --shadow: 0 1px 2px rgb(21 33 29 / 0.04), 0 8px 24px rgb(21 33 29 / 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15211d;
          --surface: #222f2a;
          --line: #35423d;
          --ink: #f4f2ec;
          --muted: #afbbb4;
          --link: #6fd3a5;
          --link-hover: #f4f2ec;
          --shadow: 0 8px 24px rgb(0 0 0 / 0.35);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        /* 100dvh, not 100%: a percentage height needs a height chain to the viewport, which this
           page does not have; dvh also follows a mobile browser's collapsing address bar. */
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/24px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 44px 32px 36px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      /* The signature drawing at its 240 px minimum. One x-height (about 16 px at this size) of
         clear space is kept on every side by the card's padding and the heading's margin. */
      .logo {
        display: block;
        width: 240px;
        height: auto;
        margin: 0 auto;
      }
      .logo-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        .logo-light {
          display: none;
        }
        .logo-dark {
          display: block;
        }
      }
      h1 {
        font-size: 26px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 28px 0 8px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
      }
      .sub {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      a {
        color: var(--link);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        color: var(--link-hover);
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
        border-radius: 4px;
      }
      /* The brand intro: once, 0.9 s in total, cubic-bezier(.2,.7,.2,1). The letters never move. */
      [data-motion='dot'] {
        animation: ai-dot 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      [data-motion='ring'] {
        animation: ai-ring 260ms cubic-bezier(0.2, 0.7, 0.2, 1) 220ms both;
      }
      [data-motion='echo'] {
        /* forwards, NOT both: during its 480 ms delay the echo must keep the drawing's own
           opacity="0". `both` would paint its first keyframe (0.55) for that whole delay and sit on
           the ring as a second ring. */
        animation: ai-echo 420ms cubic-bezier(0.2, 0.7, 0.2, 1) 480ms forwards;
      }
      @keyframes ai-dot {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes ai-ring {
        0% {
          transform: scale(0.42);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes ai-echo {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.75);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-motion] {
          animation: none;
        }
      }
    </style>
  </head>
